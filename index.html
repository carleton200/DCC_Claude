  const box = (title, sub, body) => `<div class="modal-box"><button class="x" data-close="1" title="Close (Esc)">✕</button><h2>${title}</h2>${sub?`<div class="small">${sub}</div>`:''}${body}</div>`;
  if (k==='inv'){
    const slots = SLOTS.map(sl=>{ const id=S.eq[sl]; return `<div class="slot"><div class="sl">${SLOT_NAME[sl]}</div>${id?`<div style="flex:1">${itemCard(id,{btns:ITEMS[id].cursed?'<button disabled>Cursed</button>':`<button data-unequip="${sl}">Unequip</button>`})}</div>`:'<span class="small">— empty —</span>'}</div>`; }).join('');
    const tabs = [['all','All'],['gear','Gear'],['use','Consumables'],['mat','Materials']];
    const filt = id => { const t=ITEMS[id].t; return UIX.tab==='all' || (UIX.tab==='gear'&&SLOTS.includes(slotOf(ITEMS[id]))) || (UIX.tab==='use'&&['consumable','throwable','tome'].includes(t)) || (UIX.tab==='mat'&&t==='material'); };
    const ids = Object.keys(S.inv).filter(filt).sort((a,b)=>RARITY.indexOf(ITEMS[b].r)-RARITY.indexOf(ITEMS[a].r) || ITEMS[a].n.localeCompare(ITEMS[b].n));
    const inC = S.scene==='combat';
    const cards = ids.map(id=>{ const it=ITEMS[id]; let b='';
      if (SLOTS.includes(slotOf(it))) b += `<button data-equip="${id}" ${inC?'disabled':''}>Equip</button>`;
      if (it.x) b += `<button data-use="${id}" ${inC?'disabled':''}>Use</button>`;
      return itemCard(id,{qty:S.inv[id], btns:b}); }).join('');
    h = box('🎒 Inventory', `${invCount()} items · 🪙 ${S.gold} gold${inC?' · (use items from the combat menu during fights)':''}`,
      `<h3 style="margin:14px 0 8px;font-size:13px;color:var(--muted)">EQUIPPED</h3><div class="slots">${slots}</div>
       <div class="tabs">${tabs.map(([t,n])=>`<button class="${UIX.tab===t?'on':''}" data-tab="${t}">${n}</button>`).join('')}</div>
       <div class="items">${cards || '<span class="small">Nothing here.</span>'}</div>`);
  }
  else if (k==='char'){
    const rows = STATS.map(s=>`<div class="statrow"><div class="sn">${STAT_NAME[s]}</div><div class="v" style="font-size:20px;font-weight:700">${stat(s)}</div><div class="sd">${STAT_DESC[s]}<br><span class="small">base ${S.base[s]}${raceBonus(s)?` · race ${raceBonus(s)>0?'+':''}${raceBonus(s)}`:''}${classBonus(s)?` · class +${classBonus(s)}`:''}${gearStat(s)?` · gear ${gearStat(s)>0?'+':''}${gearStat(s)}`:''}${S.floorBuff[s]?` · buff +${S.floorBuff[s]}`:''}</span></div><button data-stat="${s}" ${S.pts?'':'disabled'}>+</button></div>`).join('');
    const skills = S.skills.map(id=>`<div class="ach"><div class="an">${SKILLS[id].i} ${esc(SKILLS[id].n)}${SKILLS[id].kind==='passive'?' <span class="small">(passive)</span>':SKILLS[id].mp?` <span class="small">${SKILLS[id].mp} MP</span>`:''}</div><div class="ad">${esc(SKILLS[id].d)}</div></div>`).join('');
    h = box('🧍 Character', `Level ${S.lvl} ${S.race?RACES[S.race].n+(S.cls?' '+CLASSES[S.cls].n:''):'crawler'} · XP ${S.xp}/${CFG.xpNext(S.lvl)}`,
      `${S.pts?`<div class="pts-alert" style="cursor:default">★ ${S.pts} point${S.pts>1?'s':''} to spend</div>`:''}${rows}
      <div class="kv" style="margin-top:12px"><span>Max HP / MP</span><b>${maxHP()} / ${maxMP()}</b></div>
      <div class="kv"><span>Attack ${isUnarmed()?'(fists)':''}</span><b>~${Math.round(weaponDmg())}</b></div>
      <div class="kv"><span>Defense</span><b>${defense()}</b></div>
      <div class="kv"><span>Crit chance</span><b>${Math.round(critChance())}%</b></div>
      <div class="kv"><span>Viewer multiplier</span><b>×${viewMult().toFixed(2)}</b></div>
      <div class="kv"><span>Shop prices</span><b>${Math.round(priceMult()*100)}%</b></div>
      ${S.pet?`<div class="kv"><span>Pet: ${PETS[S.pet.kind].i} ${esc(S.pet.name)}${S.pet.talks?' (talks!)':''}</span><b>Lv ${petLevel()} · ~${Math.round(petAtk())} dmg</b></div>`:''}
      <h3 style="margin:16px 0 8px;font-size:13px;color:var(--muted)">SKILLS</h3><div class="ach-list">${skills}</div>`);
  }
  else if (k==='boxes'){
    const can = inSafeZone();
    let reveal = '';
    if (UIX.lastOpen){ const o = UIX.lastOpen;
      reveal = `<div class="box-stage"><div class="box-big reveal">${o.pet?PETS[o.pet].i:TIER_ICON[o.tier]}</div><div class="display tier-${o.tier}" style="font-size:20px;margin:6px 0">${TIERS[o.tier]} ${esc(o.kind)} Box</div>
        <div class="say" style="color:var(--gold)">+${o.gold} gold${o.pet?` · a new pet: ${esc(S.pet.name)} the ${PETS[o.pet].n}!`:''}</div></div>
        <div class="items">${o.items.map(([id,q])=>`<div class="reveal">${itemCard(id,{qty:q>1?q:0})}</div>`).join('')}</div><hr class="sep">`; }
    const list = S.boxes.map((b,i)=>`<div class="item"><div class="ii">${TIER_ICON[b.tier]}</div><div style="flex:1"><div class="in tier-${b.tier}">${TIERS[b.tier]} ${esc(b.kind)} Box</div><div class="id">${({Adventurer:'General loot: potions and gear.',Fan:'From your adoring fans: gold, fun stuff, maybe something fabulous.',Boss:'Guaranteed equipment and good loot.',Explosives:'Things that go boom.',Pet:'Something alive. Probably.'})[b.kind]}</div><div class="ib"><button data-openbox="${i}" ${can?'':'disabled'}>Open</button></div></div></div>`).join('');
    h = box('🎁 Loot Boxes', can ? 'You are in a safe zone. Open away!' : 'Boxes can only be opened in a safe room or guild.', reveal + `<div class="items">${list || '<span class="small">No unopened boxes. Earn them with achievements and viewers.</span>'}</div>`);
  }
  else if (k==='ach'){
    const n = Object.keys(S.ach).length, tot = Object.keys(ACH).length;
    h = box('🏆 Achievements', `${n}/${tot} unlocked`, `<div class="ach-list">${Object.entries(ACH).map(([id,a])=>`<div class="ach ${S.ach[id]?'':'locked'}"><div class="an">${S.ach[id]?'★ ':'🔒 '}${esc(a.n)}</div><div class="ad">${S.ach[id]?esc(a.d):'???'}</div>${a.box&&S.ach[id]?`<div class="small tier-${a.box[0]}">${TIERS[a.box[0]]} ${a.box[1]} Box</div>`:''}</div>`).join('')}</div>`);
  }
  else if (k==='lb'){
    const lb = leaderboard(); const me = lb.findIndex(r=>r.me);
    const rows = lb.slice(0,10).map((r,i)=>`<tr class="${r.me?'me':''}"><td>#${i+1}</td><td>${esc(r.n)}</td><td>${r.s.toLocaleString()}</td></tr>`).join('') + (me>=10?`<tr><td colspan="3" class="small">...</td></tr><tr class="me"><td>#${me+1}</td><td>${esc(S.name)}</td><td>${lb[me].s.toLocaleString()}</td></tr>`:'');
    h = box('📈 Top Ten Leaderboard', 'Live from the World Dungeon. Score is based on XP, kills, bosses, viewers and depth.', `<table class="lb"><tr><th>Rank</th><th>Crawler</th><th>Score</th></tr>${rows}</table><p class="small">Crawlers remaining: <b>${crawlersLeft().toLocaleString()}</b>. Top ten crawlers get their faces on every screen in the dungeon. Also, bounties.</p>`);
  }
  else if (k==='shop'){
    const where = UIX.modalArg;
    S.ff.shop = S.ff.shop || {};
    if (!S.ff.shop[where]) S.ff.shop[where] = genStock(where);
    const stock = S.ff.shop[where];
    if (UIX.tab==='all') UIX.tab='buy';
    const buy = Object.entries(stock).filter(([id,q])=>q>0).map(([id,q])=>itemCard(id,{qty:q, btns:`<button data-buy="${where}|${id}" ${S.gold<buyPrice(id)?'disabled':''}>Buy · ${buyPrice(id)}g</button>`})).join('');
    const sell = Object.keys(S.inv).map(id=>itemCard(id,{qty:S.inv[id], btns:`<button data-sell="${id}">Sell · ${sellPrice(id)}g</button>`})).join('');
    h = box(where==='guild'?"🧪 Mordecai's Potions":'🛒 Safe Room Shop', `🪙 ${S.gold} gold · prices ${Math.round(priceMult()*100)}% (Charisma helps)`,
      `<div class="tabs"><button class="${UIX.tab==='buy'?'on':''}" data-tab="buy">Buy</button><button class="${UIX.tab==='sell'?'on':''}" data-tab="sell">Sell</button></div><div class="items">${(UIX.tab==='buy'?buy:sell) || '<span class="small">Nothing here.</span>'}</div>`);
  }
  else if (k==='craft'){
    const rows = RECIPES.map((r,i)=>{ const ok = Object.entries(r.need).every(([id,q])=>hasItem(id,q)) && (!r.req || r.req()); const needs = Object.entries(r.need).map(([id,q])=>`<span style="color:${hasItem(id,q)?'var(--green)':'var(--red)'}">${ITEMS[id].i} ${ITEMS[id].n} ${S.inv[id]||0}/${q}</span>`).join(' · ');
      return itemCard(r.out, {btns:`<button data-craft="${i}" ${ok?'':'disabled'}>Craft${hasPassive('bomb_expert')&&ITEMS[r.out].boom?' ×2':''}</button></div><div class="id">${needs}${r.note?`<br>${esc(r.note)}`:''}`}); }).join('');
    h = box('🔧 Workbench', 'Combine materials into useful (and explosive) things. Search rooms and kill goblins for materials.', `<div class="items">${rows}</div>`);
  }
  else if (k==='train'){
    const rows = TRAINING.filter(t=>t[2]<=S.floor).map(([id,cost])=>{ const s=SKILLS[id]; const known=S.skills.includes(id);
      return `<div class="item"><div class="ii">${s.i}</div><div style="flex:1"><div class="in">${esc(s.n)}</div><div class="id">${esc(s.d)}</div><div class="ib">${known?'<button disabled>Known</button>':`<button data-train="${id}|${cost}" ${S.gold<cost?'disabled':''}>Learn · ${cost}g</button>`}</div></div></div>`; }).join('');
    h = box('📚 Training', '"I can teach you a few things. For a fee. Rent in the afterlife isn\'t free."', `<div class="items">${rows}</div>`);
  }
  else if (k==='menu'){
    h = box('☰ Menu', '', `<div class="choices" style="padding-top:8px">
      <button class="choice" data-menu="sound"><span class="ct">${META.sound?'🔊 Sound: ON':'🔇 Sound: OFF'}</span></button>
      <button class="choice" data-menu="help"><span class="ct">❓ How to play</span></button>
      <button class="choice" data-menu="endings"><span class="ct">🏁 Endings gallery (${Object.keys(META.endings).length}/${Object.keys(ENDINGS).length})</span></button>
      ${S ? '<button class="choice danger" data-menu="new"><span class="ct">🆕 Abandon this run and start over</span></button>' : ''}
      ${S ? '<button class="choice" data-menu="title"><span class="ct">🏠 Save & return to title</span></button>' : ''}
    </div><p class="small" style="margin-top:12px">Progress autosaves constantly. If you die, you can return to your last checkpoint (safe rooms, guilds and the start of each floor).</p>`);
  }
  else if (k==='help'){
    h = box('❓ How to Play', '', `<div class="scene-text" style="font-size:15px">
      ${P('<b>Goal:</b> survive five floors of the dungeon. Each floor has a <b>collapse timer</b>. Reach the stairwell, beat whatever guards it, and descend before time runs out.')}
      ${P('<b>Moving:</b> arrow keys / WASD, the on-screen d-pad, or click a neighboring room on the map. Every move costs time. Number keys 1–9 pick choices.')}
      ${P('<b>Stats:</b> STR (damage), CON (HP), DEX (hit, dodge, crit, escaping), INT (MP, spells, traps), CHA (viewers, prices, persuasion). You get 3 points per level — spend them in the Stats window.')}
      ${P('<b>Combat:</b> click an enemy to target it. Attack, use skills (MP), throw explosives, drink potions, or play to the crowd for viewers. Bosses usually do not let you run.')}
      ${P('<b>Loot boxes:</b> earned from achievements, bosses and viewer milestones. Open them in safe rooms (🛋️) or guilds (📚), where you can also rest, shop and craft.')}
      ${P('<b>Floor 3:</b> choose a race and a class. <b>Floor 5:</b> capture all four castles to unlock the final stairwell.')}
      ${P('<b>Endings:</b> there are many ways to finish (and to die). See how many you can find.')}
      ${P('<b>Shortcuts:</b> I = inventory, C = character, B = loot boxes, M = menu, Esc = close.')}</div>`);
  }
  else if (k==='endings'){
    h = box('🏁 Endings', 'Endings you have discovered, across all runs.', `<div class="endings">${Object.entries(ENDINGS).map(([id,e])=>`<div class="ending ${META.endings[id]?'got':''}">${META.endings[id]?`★ <b>${esc(e.n)}</b><br><span class="small">${esc(e.d)}</span>`:'? ? ?'}</div>`).join('')}</div>`);
  }
  $('#modal').innerHTML = h;
}
function genStock(where){
  const f = S.floor; const s = {};
  const add = (id,q) => { s[id] = (s[id]||0)+q; };
  if (where==='guild'){
    add('potion_heal',5); add('potion_mana',5); add('cha_cheat',1); add(pick(['tonic_str','tonic_con','tonic_dex','tonic_int','tonic_cha']),1); add('antidote',3);
    if (f>=2) add('potion_greater',2); if (f>=3) add('potion_greater',2);
  } else {
    add('potion_heal',5); add('potion_mana',3); add('antidote',3); add('water',3); add('snacks',3); add('smoke',2); add('dynamite',3); add('rag',4); add('gunpowder',3); add('herb',3); add('jug',1); add('nails',2);
    if (f>=3) add('potion_greater',2);
    for (let i=0;i<4;i++) add(rollItem({minR:0,maxR:2,types:EQUIP_TYPES}),1);
    add(rollItem({types:['tome'], maxR:3}),1);
  }
  return s;
}

/* ---------------------------- input ---------------------------- */
document.addEventListener('click', (ev)=>{
  const t = ev.target.closest('button, [data-open], [data-tgt], [data-move]'); if (!t) { if (ev.target.id==='modal') closeModal(); return; }
  const d = t.dataset;
  if (d.ch!==undefined){ const c = UIX.choices[+d.ch]; if (c && c.act && !c.disabled){ sfx('click'); c.act(); } return; }
  if (d.dir!==undefined){ move(+d.dir); return; }
  if (d.move!==undefined){ move(+d.move); return; }
  if (d.tgt!==undefined && S && S.combat && !S.combat.over){ const e=S.combat.en[+d.tgt]; if (e && !e.dead){ S.combat.target=+d.tgt; render(); } return; }
  if (d.open){ if (d.open==='menu' || S) openModal(d.open); return; }
  if (d.close){ closeModal(); return; }
  if (d.tab){ UIX.tab=d.tab; renderModal(); return; }
  if (d.equip){ equip(d.equip); sfx('click'); render(); return; }
  if (d.unequip){ unequip(d.unequip); render(); return; }
  if (d.use){ const it=ITEMS[d.use]; if (it.fx && (it.fx.aoe||it.fx.single||it.fx.escape)) { toast('SYSTEM','That one is for fights.'); return; } const m=useItem(d.use); if (m) toast('ITEM', esc(m)); render(); return; }
  if (d.stat){ if (S.pts>0){ const before=maxHP(); S.base[d.stat]++; S.pts--; if (d.stat==='con') S.hp += maxHP()-before; if (d.stat==='int') S.mp = Math.min(maxMP(), S.mp+CFG.mpPerInt); sfx('click'); render(); } return; }
  if (d.openbox!==undefined){
    if (!inSafeZone()) return;
    const b = S.boxes.splice(+d.openbox,1)[0]; const r = genBoxLoot(b.tier, b.kind); S.st.opened++;
    S.gold += r.gold; let pet=null;
    for (const [id,q] of r.items){ if (id==='__pet'){ const k=pick(Object.keys(PETS).filter(x=>x!=='raptor')); S.pet={kind:k, name:pick(['Nugget','Waffles','Professor Fluff','Tiny Steve','Duchess','Biscuit']), bonus:0, talks:false, hp:0}; S.pet.hp=petMaxHP(); pet=k; unlock('pet'); } else addItem(id,q); }
    UIX.lastOpen = {tier:b.tier, kind:b.kind, gold:r.gold, items:r.items.filter(([id])=>id!=='__pet'), pet};
    log(`Opened ${TIERS[b.tier]} ${b.kind} Box.`, 'l-loot'); sfx('box');
    render(); return;
  }
  if (d.buy){ const [where,id] = d.buy.split('|'); const p=buyPrice(id); const st=S.ff.shop[where]; if (S.gold>=p && st[id]>0){ S.gold-=p; st[id]--; addItem(id); unlock('shopper'); sfx('loot'); render(); } return; }
  if (d.sell){ const id=d.sell; if (takeItem(id)){ S.gold += sellPrice(id); sfx('click'); log(`Sold ${ITEMS[id].n}.`); render(); } return; }
  if (d.craft!==undefined){ const r=RECIPES[+d.craft]; if (Object.entries(r.need).every(([id,q])=>hasItem(id,q)) && (!r.req||r.req())){ for (const [id,q] of Object.entries(r.need)) takeItem(id,q); const n = r.qty*(hasPassive('bomb_expert')&&ITEMS[r.out].boom?2:1); addItem(r.out, n); S.st.crafted++; unlock('crafter'); sfx('loot'); toast('CRAFTED', `${ITEMS[r.out].i} ${esc(ITEMS[r.out].n)}${n>1?' ×'+n:''}`, 'loot'); render(); } return; }
  if (d.train){ const [id,cost]=d.train.split('|'); if (S.gold>=+cost && !S.skills.includes(id)){ S.gold-=+cost; learnSkill(id); render(); } return; }
  if (d.menu){
    if (d.menu==='sound'){ META.sound=!META.sound; saveMeta(); renderModal(); }
    if (d.menu==='help') openModal('help');
    if (d.menu==='endings') openModal('endings');
    if (d.menu==='ckpt'){ closeModal(); loadGame(CFG.ckptKey); toast('SYSTEM','Checkpoint loaded.'); }
    if (d.menu==='new'){ if (confirm('Abandon this crawler and start over?')) { closeModal(); newGame(); } }
    if (d.menu==='title'){ save(); closeModal(); S=null; render(); }
    return;
  }
});
document.addEventListener('keydown', (ev)=>{
  if (ev.target.tagName==='INPUT'){ if (ev.key==='Enter'){ const c=UIX.choices[0]; if(c&&c.act) c.act(); } return; }
  if (ev.key==='Escape'){ if (UIX.modal) closeModal(); return; }
  if (UIX.modal) return;
  if (ev.repeat) return;
  if (/^[1-9]$/.test(ev.key)){ const c=UIX.choices[+ev.key-1]; if (c && c.act && !c.disabled){ sfx('click'); c.act(); } return; }
  if (!S) return;
  const k = ev.key.toLowerCase();
  const dir = {arrowup:0,w:0,arrowright:1,d:1,arrowdown:2,s:2,arrowleft:3,a:3}[k];
  if (dir!==undefined && S.scene==='explore'){ ev.preventDefault(); move(dir); return; }
  if (!S.floor) return;
  if (k==='i') openModal('inv'); else if (k==='c') openModal('char'); else if (k==='b') openModal('boxes'); else if (k==='m') openModal('menu');
});

/* ---------------------------- boot ---------------------------- */
function newGame(){
  store.del(CFG.ckptKey); store.del(CFG.saveKey);
  S = newState(''); S.scene='name';
  document.documentElement.style.setProperty('--floor-accent', '#ff3e8a');
  render();
}
window.DCC = { get S(){ return S; }, set S(v){ S=v; }, go, move, playerAct, finishCombat, startFloor, newGame, render, choices:()=>UIX.choices, choose:(i)=>{ const c=UIX.choices[i]; if(c&&c.act&&!c.disabled){ c.act(); return true; } return false; }, ITEMS, ENEMIES, FLOORS, SKILLS, CFG, maxHP, maxMP, stat, weaponDmg, useItem, equip, score, myRank, genBoxLoot, closeModal };
render();
</script>
</body>
</html>
