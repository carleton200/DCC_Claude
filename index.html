<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Crawler — Enhanced</title>
<meta name="description" content="A fan-made dungeon crawler inspired by Matt Dinniman's Dungeon Crawler Carl. Survive five floors, collect loot boxes, and keep the viewers entertained.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b10; --bg2:#15131c; --panel:#1a1723; --panel2:#221e2d; --line:#3a3348;
  --text:#ece8f4; --muted:#a49cb6; --dim:#6d6680;
  --pink:#ff3e8a; --gold:#ffc83d; --cyan:#3ee6ff; --green:#4ade80; --red:#ff4d5e; --blue:#60a5fa; --purple:#c084fc; --orange:#f59e0b;
  --hp:#ff4d5e; --mp:#4f8cff; --xp:#ffc83d;
  --r-common:#c9c4d4; --r-uncommon:#4ade80; --r-rare:#60a5fa; --r-epic:#c084fc; --r-legendary:#f59e0b; --r-celestial:#ff7ad9;
  --floor-accent:#ff3e8a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--floor-accent) 18%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    var(--bg);
  color:var(--text); font-family:"Chakra Petch",system-ui,sans-serif; font-size:16px; line-height:1.45;
  min-height:100vh; transition:background .6s;
}
body.dead{ --floor-accent:#ff2030; background:radial-gradient(1000px 700px at 50% 0%, rgba(160,0,20,.55), transparent 70%), #12060a; }
body.won{ --floor-accent:#2bd46a; background:radial-gradient(1000px 700px at 50% 0%, rgba(20,140,60,.5), transparent 70%), #06120a; }
button{font-family:inherit;color:inherit}
h1,h2,h3,.display{font-family:Audiowide,"Chakra Petch",sans-serif;font-weight:400;letter-spacing:.02em}
a{color:var(--cyan)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(10,9,14,.85);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);flex-wrap:wrap}
#topbar .logo{font-family:Audiowide;font-size:18px;color:var(--pink);text-shadow:0 0 12px rgba(255,62,138,.5);white-space:nowrap;margin-right:auto}
#topbar .logo small{color:var(--muted);font-size:11px;display:block;font-family:"Chakra Petch";letter-spacing:.15em;text-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;white-space:nowrap}
.chip b{font-weight:700}
.chip.timer.warn{border-color:var(--orange);color:var(--orange)}
.chip.timer.crit{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.6s infinite}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;position:relative}
.tbtn:hover{border-color:var(--pink)}
.tbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:700}
@keyframes pulse{50%{opacity:.45}}

/* ---------- layout ---------- */
#layout{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;gap:14px;padding:14px 16px;max-width:1440px;margin:0 auto}
body.story #layout{grid-template-columns:minmax(0,820px);justify-content:center}
body.story #left, body.story #right, body.story .ingame{display:none!important}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-family:"Chakra Petch";font-weight:700}
#left,#right{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- character card ---------- */
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.avatar{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:32px;background:var(--panel2);border:1px solid var(--line);flex:none}
.who .nm{font-family:Audiowide;font-size:17px;line-height:1.15;word-break:break-word}
.who .sub{color:var(--muted);font-size:12.5px}
.bar{height:16px;border-radius:6px;background:#0a090d;border:1px solid var(--line);position:relative;overflow:hidden;margin:5px 0}
.bar .fill{height:100%;transition:width .35s ease}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.hp .fill{background:linear-gradient(90deg,#b91c2c,var(--hp))}
.bar.mp .fill{background:linear-gradient(90deg,#2747a8,var(--mp))}
.bar.xp .fill{background:linear-gradient(90deg,#b8860b,var(--xp))}
.bar.pet .fill{background:linear-gradient(90deg,#1f8a4c,var(--green))}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:.08em}
.stat .v{font-weight:700;font-size:15px}
.stat .v.up{color:var(--green)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;color:var(--muted)}
.kv b{color:var(--text)}
.pts-alert{margin-top:8px;padding:6px 8px;border-radius:8px;background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.4);color:var(--gold);font-size:13px;cursor:pointer;text-align:center}
.equip-mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.equip-mini span{font-size:20px;width:34px;height:34px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.equip-mini span.empty{opacity:.25;font-size:14px}
.statuses{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.st{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}

/* ---------- scene ---------- */
#scene{min-height:440px;display:flex;flex-direction:column}
.scene-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.scene-art{width:76px;height:76px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:44px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--floor-accent) 35%,var(--panel2)),var(--panel2));border:1px solid var(--line);box-shadow:0 0 24px color-mix(in srgb,var(--floor-accent) 25%,transparent)}
.scene-title{font-family:Audiowide;font-size:23px;line-height:1.15;margin:0}
.scene-kicker{color:var(--floor-accent);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.scene-text{font-size:16.5px;color:#ddd7ea}
.scene-text p{margin:0 0 10px}
.scene-text .sys{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--cyan);background:rgba(62,230,255,.06);border-left:3px solid var(--cyan);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;white-space:pre-wrap}
.scene-text .say{color:var(--gold)}
.scene-text .bad{color:var(--red)}
.scene-text .good{color:var(--green)}
.scene-text .muted{color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:14px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15.5px;transition:transform .08s,border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--floor-accent);background:color-mix(in srgb,var(--floor-accent) 10%,var(--panel2));transform:translateX(3px)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.choice .key{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#0a090d;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.choice .ct{flex:1}
.choice .cs{display:block;font-size:12.5px;color:var(--muted)}
.choice.danger{border-color:rgba(255,77,94,.5)}
.choice.special{border-color:rgba(255,200,61,.55)}
.choice.primary{border-color:color-mix(in srgb,var(--floor-accent) 70%,transparent)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.name-input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:10px;background:#0a090d;border:1px solid var(--line);color:var(--text);margin:8px 0 4px}
.name-input:focus{outline:none;border-color:var(--pink)}

/* explore controls */
.explore-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.explore-row .choices{flex:1;min-width:220px;margin-top:0;padding-top:0}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;flex:none}
.dpad button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:20px;cursor:pointer}
.dpad button:hover:not(:disabled){border-color:var(--floor-accent)}
.dpad button:disabled{opacity:.2;cursor:not-allowed}
.dpad .c{display:grid;place-items:center;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;text-align:center;line-height:1.1}

/* ---------- map ---------- */
.map-wrap{display:flex;justify-content:center}
.map-grid{display:grid;gap:0;background:#08070b;border:1px solid var(--line);border-radius:8px;padding:6px}
.cell{width:30px;height:30px;display:grid;place-items:center;font-size:15px;position:relative;border:2px solid transparent}
.cell.unk{background:rgba(255,255,255,.018);border-radius:3px;transform:scale(.86)}
.mstat{display:none}
.cell.seen{background:#17141f}
.cell.vis{background:#251f31}
.cell.here{background:color-mix(in srgb,var(--floor-accent) 45%,#251f31);box-shadow:inset 0 0 0 2px var(--floor-accent);border-radius:4px}
.cell.wn{border-top-color:#4d4560}.cell.we{border-right-color:#4d4560}.cell.ws{border-bottom-color:#4d4560}.cell.ww{border-left-color:#4d4560}
.cell.unk.wn,.cell.unk.we,.cell.unk.ws,.cell.unk.ww{border-color:transparent}
.cell .ic{filter:saturate(.9)}
.cell.seen .ic{opacity:.55}
.map-legend{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center}

/* ---------- log ---------- */
#log{max-height:330px;overflow:auto;font-size:13px;display:flex;flex-direction:column-reverse;gap:3px}
#log div{padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.02)}
#log .l-good{color:var(--green)}#log .l-bad{color:var(--red)}#log .l-sys{color:var(--cyan)}#log .l-loot{color:var(--gold)}#log .l-ach{color:var(--pink)}

/* ---------- combat ---------- */
.enemies{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 12px}
.enemy{width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative;transition:transform .1s,border-color .15s}
.enemy:hover{border-color:var(--muted)}
.enemy.target{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 18px rgba(255,77,94,.25)}
.enemy.dead{opacity:.28;filter:grayscale(1);cursor:default}
.enemy.boss{width:190px;border-color:rgba(255,200,61,.55)}
.enemy .ei{font-size:40px;line-height:1.1}
.enemy.boss .ei{font-size:56px}
.enemy .en{font-weight:700;font-size:13.5px;line-height:1.2;margin-top:4px}
.enemy .el{font-size:11.5px;color:var(--muted)}
.enemy .bar{height:10px}
.enemy.hit{animation:shake .32s}
.enemy .tgt{position:absolute;top:6px;right:8px;font-size:12px;color:var(--red)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.clog{background:#0b0a0f;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;min-height:110px;max-height:190px;overflow:auto}
.clog div{padding:1px 0}
.clog .c-p{color:#cfe9ff}.clog .c-e{color:#ffb4bd}.clog .c-crit{color:var(--gold);font-weight:700}.clog .c-sys{color:var(--cyan)}.clog .c-pet{color:var(--green)}.clog .c-dim{color:var(--dim)}
.pet-line{font-size:13px;color:var(--muted);margin:6px 0 0}
.flash-red{animation:flashred .4s}
@keyframes flashred{0%{box-shadow:inset 0 0 0 999px rgba(255,0,40,.25)}100%{box-shadow:none}}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(5,4,8,.78);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;backdrop-filter:blur(3px)}
.modal-box{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;width:min(860px,100%);padding:18px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-box h2{margin:0 0 4px;font-size:22px}
.modal-box .x{position:absolute;top:12px;right:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.tabs button.on{border-color:var(--pink);color:var(--pink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--rc,var(--r-common));border-radius:10px;padding:9px 10px}
.item .ii{font-size:26px;line-height:1;flex:none;width:32px;text-align:center}
.item .in{font-weight:700;font-size:14px;color:var(--rc,var(--text))}
.item .id{font-size:12px;color:var(--muted)}
.item .ib{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.item .ib button,.sbtn{background:#0d0c12;border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12.5px}
.item .ib button:hover,.sbtn:hover{border-color:var(--pink)}
.item .ib button:disabled{opacity:.35;cursor:not-allowed}
.qty{color:var(--muted);font-weight:400;font-size:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:14px}
.slot{display:flex;gap:10px;align-items:center;background:#0d0c12;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:52px}
.slot .sl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;width:58px;flex:none}
.rar-common{--rc:var(--r-common)}.rar-uncommon{--rc:var(--r-uncommon)}.rar-rare{--rc:var(--r-rare)}.rar-epic{--rc:var(--r-epic)}.rar-legendary{--rc:var(--r-legendary)}.rar-celestial{--rc:var(--r-celestial)}
.statrow{display:grid;grid-template-columns:110px 60px 1fr 40px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.statrow .sn{font-weight:700}
.statrow .sd{font-size:12.5px;color:var(--muted)}
.statrow button{background:var(--panel2);border:1px solid var(--gold);color:var(--gold);border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:18px}
.statrow button:disabled{opacity:.2;border-color:var(--line);color:var(--muted);cursor:not-allowed}
.ach-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ach{padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.ach.locked{opacity:.4}
.ach .an{font-weight:700;color:var(--pink)}
.ach .ad{font-size:12.5px;color:var(--muted)}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb td,table.lb th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.lb tr.me{background:rgba(255,62,138,.12);color:var(--pink);font-weight:700}
.box-stage{text-align:center;padding:20px 0}
.box-big{font-size:90px;display:inline-block}
.box-big.shake{animation:boxshake .7s ease-in-out 2}
@keyframes boxshake{10%,90%{transform:rotate(-4deg)}20%,80%{transform:rotate(6deg)}30%,50%,70%{transform:rotate(-9deg) scale(1.05)}40%,60%{transform:rotate(9deg) scale(1.08)}}
.reveal{animation:pop .4s ease-out both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.tier-0{color:#d08a4f}.tier-1{color:#d7dbe2}.tier-2{color:var(--gold)}.tier-3{color:#9ee7f0}.tier-4{color:var(--orange)}.tier-5{color:var(--r-celestial)}
.endings{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:8px}
.ending{font-size:13px;padding:6px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.ending.got{border-color:var(--gold);color:var(--gold)}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:72px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:rgba(8,20,26,.96);border:1px solid var(--cyan);border-radius:10px;padding:10px 12px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s ease-out both}
.toast .th{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--cyan);margin-bottom:3px}
.toast.ach{border-color:var(--pink);background:rgba(30,8,20,.96)}.toast.ach .th{color:var(--pink)}
.toast.loot{border-color:var(--gold);background:rgba(30,24,6,.96)}.toast.loot .th{color:var(--gold)}
.toast.bad{border-color:var(--red);background:rgba(30,6,8,.96)}.toast.bad .th{color:var(--red)}
.toast.out{animation:tout .35s ease-in forwards}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}

/* ---------- title ---------- */
.title-hero{text-align:center;padding:10px 0 4px}
.title-hero h1{font-size:clamp(30px,6vw,52px);margin:0;color:var(--pink);text-shadow:0 0 24px rgba(255,62,138,.55);line-height:1.05}
.title-hero .tag{color:var(--muted);letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin-top:6px}
.title-hero .big{font-size:64px;margin:10px 0}
.small{font-size:12.5px;color:var(--muted)}
.fine{font-size:11.5px;color:var(--dim);text-align:center;margin-top:14px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

@media (max-width:1100px){
  #layout{grid-template-columns:250px minmax(0,1fr)}
  #right{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;gap:14px}
}
@media (max-width:760px){
  #layout{grid-template-columns:minmax(0,1fr);padding:10px 16px}
  #right{grid-template-columns:1fr}
  #left{order:3}#center{order:1}#right{order:2}
  .mstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px 0 10px}
  .mstat .bar{margin:0}
  .tbtn .tl,#topbar .logo small{display:none}
  #topbar{gap:6px;padding:8px 12px}
  .scene-art{width:58px;height:58px;font-size:34px}
  .scene-title{font-size:19px}
  #topbar .logo{font-size:15px}
  .enemy{width:128px}.enemy.boss{width:160px}
  .statrow{grid-template-columns:90px 44px 1fr 38px}
  .cell{width:26px;height:26px;font-size:13px}
}
</style>
</head>
<body class="story">
<header id="topbar">
  <div class="logo">DUNGEON CRAWLER <span id="tb-name">???</span><small>A fan-made crawl &middot; Season 1</small></div>
  <span class="chip ingame" id="tb-floor">Floor 1</span>
  <span class="chip timer ingame" id="tb-timer" title="Time until this floor collapses">⏳ --</span>
  <span class="chip live ingame" id="tb-views" title="Viewers watching you right now">0</span>
  <span class="chip ingame" id="tb-gold" title="Gold">🪙 0</span>
  <button class="tbtn ingame" data-open="inv" title="Inventory (I)">🎒<span class="tl"> Bag</span></button>
  <button class="tbtn ingame" data-open="char" title="Character (C)">🧍<span class="tl"> Stats</span><span class="badge hidden" id="tb-pts">!</span></button>

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------------------------- stats ---------------------------- */
function gearStat(k){ let s=0; if(!S) return 0; for(const sl of SLOTS){ const id=S.eq[sl]; if(id && ITEMS[id] && ITEMS[id].s && ITEMS[id].s[k]) s+=ITEMS[id].s[k]; } return s; }
function raceBonus(k){ return S.race ? (RACES[S.race].bonus[k]||0) : 0; }
function classBonus(k){ return S.cls ? ((CLASSES[S.cls].bonus||{})[k]||0) : 0; }
function stat(k){
  let v = S.base[k] + gearStat(k) + raceBonus(k) + classBonus(k) + (S.floorBuff[k]||0);
  if (S.combat && S.combat.buff) v += S.combat.buff[k]||0;
  return Math.max(1, v);
}
function hasPassive(id){ return S.skills.includes(id); }
function maxHP(){ return Math.round(CFG.startHP + stat('con')*CFG.hpPerCon + S.lvl*CFG.hpPerLvl + gearStat('hp')); }
function maxMP(){ return Math.round(CFG.mpBase + stat('int')*CFG.mpPerInt + gearStat('mp')); }
function defense(){ return gearStat('def') + Math.floor(stat('con')/4) + (S.race==='dwarf'?2:0); }
function isUnarmed(){ return !S.eq.weapon || !!ITEMS[S.eq.weapon].unarmed; }
function critChance(){ return clamp(5 + stat('dex')*0.6 + gearStat('crit') + (hasPassive('iron_fists')&&isUnarmed()?8:0), 0, 60); }
function unarmedDmg(){ const w=S.eq.weapon && ITEMS[S.eq.weapon].unarmed ? ITEMS[S.eq.weapon] : null; let d = 2 + stat('str')*1.4 + (w? w.s.dmg:0); if(hasPassive('iron_punch')) d*=1.5; if(hasPassive('iron_fists')) d*=1.5; return d; }
function weaponDmg(){ if(isUnarmed()) return unarmedDmg(); const w=ITEMS[S.eq.weapon]; let d = w.s.dmg + stat('str')*1.2; if(hasPassive('blade_disc')) d*=1.35; return d; }
function hitChance(e){ return clamp(88 + (stat('dex')-e.dex)*1.5 + (hasPassive('blade_disc')&&!isUnarmed()?8:0), 55, 98); }
function dodgeChance(e){ return clamp(5 + (stat('dex')-e.dex)*1.5, 2, 35); }
function healMult(){ return hasPassive('triage') ? 1.5 : 1; }
function viewMult(){ return (1 + stat('cha')*0.04) * (1 + gearStat('views')/100) * (hasPassive('manager')?2:1) * (S.pet&&S.pet.talks?1.15:1); }
function boomMult(){ return (1 + 0.35*(Math.max(1,S.floor)-1)) * (1 + (gearStat('boom') + (hasPassive('bomb_expert')?60:0) + (S.race==='dwarf'?25:0))/100); }
function priceMult(){ return Math.max(0.55, 1 - stat('cha')*0.012 - (hasPassive('manager')?0.15:0)); }
function floorPrice(){ return 1 + 0.45*(Math.max(1,S.floor)-1); }
function buyPrice(id){ return Math.max(1, Math.round(ITEMS[id].v * floorPrice() * priceMult())); }
function sellPrice(id){ const crafted = RECIPES.some(r=>r.out===id); return Math.max(1, Math.round(ITEMS[id].v * (crafted?0.15:0.4) * floorPrice())); }
function chaBonus(){ return hasPassive('manager') ? 4 : 0; }
function checkChance(k, dc, bonus=0){ // d20 + stat (+bonus) >= dc
  const need = dc - stat(k) - bonus - (k==='cha'?chaBonus():0); return clamp((21-need)/20, 0.05, 0.95);
}
function check(k, dc, bonus=0){ return Math.random() < checkChance(k, dc, bonus); }
function pct(p){ return Math.round(p*100)+'%'; }
function floorDC(){ return 10 + Math.max(1,S.floor)*3; }
function petLevel(){ return S.pet ? Math.max(1, S.lvl - 2 + (S.pet.bonus||0)) : 0; }
function petMaxHP(){ return S.pet ? Math.round((30 + petLevel()*14) * PETS[S.pet.kind].hp) : 0; }
function petAtk(){ return S.pet ? (4 + petLevel()*2.6) * PETS[S.pet.kind].atk * (S.pet.talks?1.2:1) : 0; }

/* ---------------------------- log, toasts ---------------------------- */
function log(t, c=''){ if(!S) return; S.log.push({t,c}); if(S.log.length>90) S.log.shift(); }
function toast(head, body, cls=''){
  const box = $('#toasts'); if(!box) return;
  const d = document.createElement('div'); d.className='toast '+cls;
  d.innerHTML = `<div class="th">${esc(head)}</div><div>${body}</div>`;
  box.appendChild(d);
  while (box.children.length>4) box.removeChild(box.firstChild);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(), 400); }, 4800);
}

/* ---------------------------- sound ---------------------------- */
const AudioFX = { ctx:null };
function actx(){ if(!AudioFX.ctx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; AudioFX.ctx = new C(); } return AudioFX.ctx; }
function tone(f, dur, type='sine', vol=.12, slide=0, delay=0){
  const c=actx(); if(!c) return; const t=c.currentTime+delay; const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, vol=.15, delay=0, lp=1800){
  const c=actx(); if(!c) return; const t=c.currentTime+delay; const n=Math.floor(c.sampleRate*dur); const b=c.createBuffer(1,n,c.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; const g=c.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
function sfx(n){
  if(!META.sound) return;
  try{
    switch(n){
      case 'hit': noise(.09,.18); tone(190,.12,'square',.05,.5); break;
      case 'crit': noise(.14,.22); tone(620,.18,'sawtooth',.07,2); break;
      case 'miss': tone(420,.12,'sine',.05,.6); break;
      case 'hurt': tone(140,.2,'square',.08,.45); noise(.1,.1,0,900); break;
      case 'heal': [523,659,784].forEach((f,i)=>tone(f,.18,'sine',.07,0,i*.07)); break;
      case 'level': [523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.09,0,i*.09)); break;
      case 'loot': tone(880,.1,'triangle',.07); tone(1320,.16,'triangle',.07,0,.08); break;
      case 'ach': [784,988,1175,1568].forEach((f,i)=>tone(f,.2,'square',.05,0,i*.08)); break;
      case 'death': tone(320,1.1,'sawtooth',.08,.18); break;
      case 'boom': noise(.6,.35,0,700); tone(90,.5,'sine',.15,.4); break;
      case 'step': noise(.04,.05,0,500); break;
      case 'click': tone(900,.04,'square',.03); break;
      case 'boss': [196,185,175,147].forEach((f,i)=>tone(f,.35,'sawtooth',.06,0,i*.22)); break;

/* ---------------------------- inventory ---------------------------- */
function addItem(id, q=1, quiet=false){
  if(!ITEMS[id]) return;
  S.inv[id] = (S.inv[id]||0) + q;
  if(!quiet) log(`Got ${ITEMS[id].i} ${ITEMS[id].n}${q>1?' ×'+q:''}`, 'l-loot');
  const total = Object.values(S.inv).reduce((a,b)=>a+b,0);
  if (S.eq.legs==='boxers' && S.eq.feet==='crocs') unlock('fashion');
  return total;
}
function hasItem(id, q=1){ return (S.inv[id]||0) >= q; }
function takeItem(id, q=1){ if(!hasItem(id,q)) return false; S.inv[id]-=q; if(S.inv[id]<=0) delete S.inv[id]; return true; }
function invCount(){ return Object.values(S.inv).reduce((a,b)=>a+b,0); }
function equip(id){
  const it = ITEMS[id]; if(!it || !SLOTS.includes(slotOf(it))) return;
  const sl = slotOf(it);
  const cur = S.eq[sl];
  if (cur && ITEMS[cur].cursed){ toast('SYSTEM', `Your ${esc(ITEMS[cur].n)} refuses to come off. It is, after all, cursed. The fine print said so.`, 'bad'); return; }
  if (!takeItem(id)) return;
  if (cur) addItem(cur, 1, true);
  S.eq[sl] = id;
  const hpPct = S.hp / maxHP();
  log(`Equipped ${it.i} ${it.n}.`);
  if (it.cursed) toast('SYSTEM', `The ${esc(it.n)} tightens. You get the feeling it isn't coming off. Ever. Looks great, though.`, 'bad');
  if (S.eq.legs==='boxers' && S.eq.feet==='crocs') unlock('fashion');
  S.hp = Math.min(S.hp, maxHP()); S.mp = Math.min(S.mp, maxMP());
}
function unequip(sl){
  const id = S.eq[sl]; if(!id) return;
  if (ITEMS[id].cursed){ toast('SYSTEM', `Nope. The ${esc(ITEMS[id].n)} is cursed. It is part of you now.`, 'bad'); return; }
  S.eq[sl] = null; addItem(id,1,true); log(`Unequipped ${ITEMS[id].n}.`);
  S.hp = Math.min(S.hp, maxHP()); S.mp = Math.min(S.mp, maxMP());
}
function slotOf(it){ return it.t==='weapon' ? 'weapon' : it.t; }

function healP(n, silent){ const before=S.hp; S.hp = Math.min(maxHP(), S.hp + Math.round(n*healMult())); const got=S.hp-before; if(!silent && got>0) sfx('heal'); return got; }
function learnSkill(id){

// returns a message string, or null if not used
function useItem(id){
  const it = ITEMS[id]; if(!it || !hasItem(id)) return null;

  }

    if (S.combat.noFlee) { toast('SYSTEM','The smoke clears instantly. This fight does not allow escape.','bad'); return null; }

  }

    takeItem(id); sfx('boom');
    const c = S.combat; let kills0 = c.killsThisAction = 0;
    if (fx.aoe){
      clog(`You throw the ${it.n}! ${fx.aoe>=60?'KA-BOOOOM!':'BOOM!'}`, 'c-p');
      for (const e of aliveEnemies()) { dmgEnemy(e, fx.aoe*boomMult(), {kind:'boom'}); if(fx.status && !e.dead) addEnemyStatus(e, fx.status[0], fx.status[1], Math.max(3, Math.round(e.maxHp*0.04))); }
    } else {

    }
    if (c.killsThisAction>=3) unlock('pyro');
    return null;
  }
  // consumable effects
  takeItem(id);
  if (fx.heal){ const g=healP(fx.heal); msg.push(`+${g} HP`); }
  if (fx.healPct){ const g=healP(maxHP()*fx.healPct/100); msg.push(`+${g} HP`); }
  if (fx.mp){ const b=S.mp; S.mp=Math.min(maxMP(), S.mp+fx.mp); msg.push(`+${S.mp-b} MP`); }
  if (fx.mpPct){ const b=S.mp; S.mp=Math.min(maxMP(), S.mp+Math.round(maxMP()*fx.mpPct/100)); msg.push(`+${S.mp-b} MP`); }
  if (fx.cure){ if(inC){ delete S.combat.pst.poison; delete S.combat.pst.burn; delete S.combat.pst.confuse; } msg.push('cured'); }
  if (fx.buff){ if(inC){ for(const [k,v] of Object.entries(fx.buff)) S.combat.buff[k]=(S.combat.buff[k]||0)+v; } else { S.nextBuff = S.nextBuff || {}; for(const [k,v] of Object.entries(fx.buff)) S.nextBuff[k]=(S.nextBuff[k]||0)+v; } msg.push(Object.entries(fx.buff).map(([k,v])=>`${v>0?'+':''}${v} ${k.toUpperCase()}`).join(', ')+(inC?'':' next fight')); }
  if (fx.perm){ for(const [k,v] of Object.entries(fx.perm)) S.base[k]+=v; msg.push(Object.entries(fx.perm).map(([k,v])=>`permanent +${v} ${k.toUpperCase()}`).join(', ')); }
  if (fx.floorBuff){ for(const [k,v] of Object.entries(fx.floorBuff)) S.floorBuff[k]=(S.floorBuff[k]||0)+v; msg.push(Object.entries(fx.floorBuff).map(([k,v])=>`+${v} ${k.toUpperCase()} this floor`).join(', ')); }
  if (fx.heal || fx.healPct){ S.st.heals++; if(S.st.heals>=10) unlock('potions_10'); }
  const m = `You use ${it.i} ${it.n}: ${msg.join(', ')}.`;
  log(m, 'l-good');
  return m;
}

  while (S.xp >= CFG.xpNext(S.lvl)){
    S.xp -= CFG.xpNext(S.lvl); S.lvl++; S.pts += CFG.statPtsPerLevel; leveled = true;
    S.hp = maxHP(); S.mp = maxMP(); if(S.pet) S.pet.hp = petMaxHP();

const VIEW_MS = [[1000,0],[10000,0],[50000,1],[250000,1],[1e6,2],[5e6,3],[25e6,4],[1e8,5]];

function rollItem({floor=S.floor, minR=0, maxR=2, types=null}={}){
  const pool = Object.values(ITEMS).filter(it => it.f>0 && it.f<=Math.max(1,floor) && RARITY.indexOf(it.r)>=minR && RARITY.indexOf(it.r)<=maxR && (!types || types.includes(it.t)));

  const weighted = pool.map(it => [ (it.f===floor?3:1) * (it.t==='consumable'||it.t==='material'?1.2:1) * (it.r==='common'?3:it.r==='uncommon'?2:it.r==='rare'?1:0.5), it.id ]);
  return wpick(weighted);
}
const EQUIP_TYPES = ['weapon','head','body','legs','feet','trinket'];
function genBoxLoot(tier, kind){

    const pool = ['potion_heal','potion_heal','snacks','candy','booze','smoke','tonic_cha','potion_mana'];

    if (tier>=1 && chance(.35)) out.push([pick(['spork','fan_pendant','enchanted_boxers','rabbit_foot']),1]);
    if (tier>=2 && chance(.45)) out.push(['pet_biscuit',1]);
    if (tier>=2 && chance(.25)) out.push(['tiara',1]);
    if (tier>=4) out.push([pick(['tonic_str','tonic_con','tonic_dex','tonic_int','tonic_cha']),1]);
  } else if (kind==='Boss'){
    out.push([rollItem({minR:Math.max(1,minR), maxR, types:EQUIP_TYPES}),1]);
    for(let i=0;i<n-1;i++) out.push([rollItem({minR, maxR}),1]);
    if (tier>=2) out.push([pick(['tonic_str','tonic_con','tonic_dex','tonic_int','tonic_cha']),1]);
    if (tier>=4 && chance(.4)) out.push(['chainsaw',1]);
  } else if (kind==='Pet'){

  }
  if (tier>=5) { out.push(['chainsaw',1]); out.push(['pet_biscuit',1]); }

}

/* ---------------------------- map ---------------------------- */
const DIRS = [[0,-1,'North','↑'],[1,0,'East','→'],[0,1,'South','↓'],[-1,0,'West','←']];
function genMap(f){
  const F = FLOORS[f]; const W=F.w, H=F.h, N=W*H; const idx=(x,y)=>y*W+x;
  const rooms = Array.from({length:N}, (_,i)=>({x:i%W, y:Math.floor(i/W), d:[0,0,0,0], type:'empty', seen:0, vis:0, done:0, nm:'', ds:0, srch:0}));
  let start;
  if (f===5) start = idx(Math.floor(W/2), H-1);
  else { const side=rand(0,3); start = side===0?idx(rand(0,W-1),0): side===1?idx(W-1,rand(0,H-1)): side===2?idx(rand(0,W-1),H-1): idx(0,rand(0,H-1)); }
  // DFS maze
  const seenSet = new Set([start]); const stack=[start];
  while(stack.length){
    const cur = stack[stack.length-1]; const r=rooms[cur];
    const opts = shuffle([0,1,2,3]).filter(d=>{ const nx=r.x+DIRS[d][0], ny=r.y+DIRS[d][1]; return nx>=0&&ny>=0&&nx<W&&ny<H&&!seenSet.has(idx(nx,ny)); });
    if(!opts.length){ stack.pop(); continue; }
    const d = opts[0]; const nx=r.x+DIRS[d][0], ny=r.y+DIRS[d][1]; const ni=idx(nx,ny);
    r.d[d]=1; rooms[ni].d[(d+2)%4]=1; seenSet.add(ni); stack.push(ni);
  }
  // loops
  for (const r of rooms){ for (const d of [1,2]){ const nx=r.x+DIRS[d][0], ny=r.y+DIRS[d][1]; if(nx<W&&ny<H&&!r.d[d]&&chance(f===5?0.3:0.17)){ r.d[d]=1; rooms[idx(nx,ny)].d[(d+2)%4]=1; } } }
  // distances
  const dist = new Array(N).fill(-1); dist[start]=0; const q=[start];
  while(q.length){ const c=q.shift(); const r=rooms[c]; for(let d=0;d<4;d++){ if(!r.d[d]) continue; const ni=idx(r.x+DIRS[d][0], r.y+DIRS[d][1]); if(dist[ni]<0){ dist[ni]=dist[c]+1; q.push(ni);} } }
  const maxD = Math.max(...dist);
  rooms.forEach((r,i)=>{ r.dist=dist[i]; r.nm=pick(F.names); r.ds=rand(0,F.descs.length-1); });
  const free = i => rooms[i].type==='empty' && i!==start;
  const nearest = target => { let best=-1,bd=1e9; rooms.forEach((r,i)=>{ if(!free(i)) return; const dd=Math.abs(r.dist-target)+Math.random()*0.9; if(dd<bd){bd=dd;best=i;} }); return best; };
  rooms[start].type='start'; rooms[start].done=1; rooms[start].nm='Entry Point';
  let stairs;
  if (f===5) stairs = idx(Math.floor(W/2), Math.floor(H/2));
  else { stairs = dist.indexOf(maxD); }
  rooms[stairs].type='stairs'; rooms[stairs].nm = f===5?'The Central Bubble':'Stairwell';
  // region for floor 5
  if (f===5){
    const cx=Math.floor(W/2), cy=Math.floor(H/2);
    rooms.forEach(r=>{ r.region = (r.x<cx&&r.y<cy)?'land':(r.x>cx&&r.y<cy)?'sea':(r.x<cx&&r.y>cy)?'air':(r.x>cx&&r.y>cy)?'sub':pick(['land','sea','air','sub']); });
    const corners = {land:idx(0,0), sea:idx(W-1,0), air:idx(0,H-1), sub:idx(W-1,H-1)};
    const lords = {land:'lord_land', sea:'lord_sea', air:'lord_air', sub:'lord_sub'};
    const cnames = {land:'The Land Castle', sea:'The Sea Castle', air:'The Air Castle', sub:'The Subterranean Castle'};
    for (const [reg,i] of Object.entries(corners)){ rooms[i].type='castle'; rooms[i].region=reg; rooms[i].boss=lords[reg]; rooms[i].nm=cnames[reg]; }
  }
  // bosses at far dead ends
  const deadEnds = rooms.map((r,i)=>i).filter(i=>free(i) && rooms[i].d.reduce((a,b)=>a+b,0)===1).sort((a,b)=>rooms[b].dist-rooms[a].dist);
  for (const b of F.bosses){
    let i = deadEnds.find(x=>free(x) && rooms[x].dist>=Math.floor(maxD*0.35)); if (i===undefined) i = nearest(Math.floor(maxD*0.7));
    if (i<0) continue; rooms[i].type='boss'; rooms[i].boss=b; rooms[i].nm = ENEMIES[b].n+"'s Lair";
  }
  // safe rooms
  for (const fr of [0.3, 0.68]){ const i=nearest(Math.round(maxD*fr)); if(i>=0){ rooms[i].type='safe'; rooms[i].nm=F.safeName; } }
  // guild
  { const i = nearest(f===1 ? 3 : Math.round(maxD*0.5)); if(i>=0){ rooms[i].type='guild'; rooms[i].nm = f===1 ? 'Tutorial Guild' : "Mordecai's Guild Hall"; } }
  // floor specials
  if (f===1){
    const adj = rooms[start].d.map((o,d)=>o? idx(rooms[start].x+DIRS[d][0], rooms[start].y+DIRS[d][1]) : -1).filter(i=>i>=0 && free(i));
    if (adj.length){ const i=adj[0]; rooms[i].type='monster'; rooms[i].first=1; rooms[i].nm='Goblin-Infested Hallway'; }
    const t = nearest(Math.round(maxD*0.45)); if(t>=0){ rooms[t].type='thrax'; rooms[t].nm='A Second Tutorial Guild?'; }
  }
  if (f===2){ const t = nearest(Math.round(maxD*0.55)); if(t>=0){ rooms[t].type='rage'; rooms[t].nm='Scorched Plaza'; } }
  if (f===4){
    const cand = rooms.map((r,i)=>i).filter(free); shuffle(cand);
    const plats=[]; for(const i of cand){ if(plats.length>=6) break; if(plats.every(p=>Math.abs(rooms[p].x-rooms[i].x)+Math.abs(rooms[p].y-rooms[i].y)>=3)) plats.push(i); }
    const lines = ['Red Line','Blue Line','Green Line','Night Line','Express','Loop Line'];
    plats.forEach((i,k)=>{ rooms[i].type='platform'; rooms[i].nm=`${lines[k]} Platform`; rooms[i].line=lines[k]; });
  }
  // remaining rooms
  const evs = F.events.map(([e,w])=>[w,e]);
  rooms.forEach((r,i)=>{
    if (!free(i)) return;
    if (r.dist<=1 && f!==1) { r.type = chance(.5)?'empty':'monster'; return; }
    const t = wpick([[40,'monster'],[24,'empty'],[20,'event'],[f>=2?7:5,'elite']]);
    r.type = t;
    if (t==='event') r.ev = wpick(evs);
  });
  // floor 4 bounty hunters if famous
  return {w:W, h:H, rooms, start, stairs, maxD};
}
function room(i=S.pos){ return S.map.rooms[i]; }
function nbr(i, d){ const r=room(i); if(!r.d[d]) return -1; return (r.y+DIRS[d][1])*S.map.w + (r.x+DIRS[d][0]); }
function reveal(i){
  const r = room(i); r.vis=1; r.seen=1;
  for(let d=0; d<4; d++){ const n=nbr(i,d); if(n>=0) room(n).seen=1; }
}
function revealAll(){ for (const r of S.map.rooms) r.seen=1; }
function stairsKnown(){ return !!room(S.map.stairs).seen; }

}
function buildGroup(spec, lvlBump=0){

  const out=[]; for (const [id,a,b] of spec){ const n=rand(a,b); for(let k=0;k<n;k++){ const t=ENEMIES[id]; const L = t.L ? clamp(t.L + rand(-1,1) + lvlBump, 1, 99) : null; out.push(makeEnemy(id, L)); } }
  return out;
}
function startCombat(enemies, o={}){

  S.combat = { en:list, target:0, turn:1, log:[], menu:null, over:false, result:null,

    pst:{}, cd:{}, buff:{}, crowd:0, rw:{xp:0,gold:0,items:[]}, killsThisAction:0, lure:!!o.lure, startHP:S.hp };
  if (S.nextBuff){ Object.assign(S.combat.buff, S.nextBuff); S.nextBuff=null; }

  if (o.intro) clog(o.intro, 'c-sys');
  if (list.some(e=>e.boss)) { sfx('boss'); clog('⚠ BOSS BATTLE ⚠', 'c-crit'); }
  if (o.speedbump){ const b=list.find(e=>e.boss); if(b){ const d=Math.round(b.maxHp*0.25); b.hp-=d; clog(`Team Meadow Lark rolls out THE SPEEDBUMP! It slams into ${b.n} for ${d} damage!`, 'c-crit'); } }
  if (o.ambush){ clog('AMBUSH! They strike first!', 'c-e'); enemyPhase(); if (S.hp<=0) return playerDied(); }
  go('combat');
}
function clog(t, c=''){ if(!S.combat) return; S.combat.log.push({t,c}); if(S.combat.log.length>60) S.combat.log.shift(); }
function aliveEnemies(){ return S.combat ? S.combat.en.filter(e=>!e.dead) : []; }
function currentTarget(){ const c=S.combat; let e=c.en[c.target]; if(!e||e.dead){ e=aliveEnemies()[0]; c.target = c.en.indexOf(e); } return e; }
function addEnemyStatus(e, k, turns, dmg){ e.st[k] = {t:turns, d:dmg}; }

function dmgEnemy(e, raw, o={}){
  const c = S.combat; if (!e || e.dead) return 0;
  if (o.canMiss && Math.random()*100 >= hitChance(e)){ clog(`${o.label||'You'} miss${o.label?'es':''} the ${e.n}.`, 'c-dim'); sfx('miss'); return 0; }
  let d = raw * rf(0.9, 1.1); let crit=false;
  if (o.canCrit && Math.random()*100 < critChance()){ d *= 1.8; crit=true; }
  const red = e.def * (o.kind==='spell'||o.kind==='boom' ? 0.3 : 0.6);
  d = Math.max(1, Math.round(d - red));
  e.hp -= d; UIX.fx.push(e.uid);
  const who = o.label || 'You';
  if (crit){ clog(`CRITICAL! ${who} hit${o.label?'s':''} ${e.n} for ${d}!`, 'c-crit'); sfx('crit'); if(chance(.35)) toast('SYSTEM', esc(pick(AI_QUIPS.crit))); addViews(e.L*6*Math.pow(2.6,S.floor-1)); }
  else { clog(`${who} ${o.verb||'hit'}${o.label&&!o.verb?'s':''} ${e.n} for ${d}.`, o.kind==='pet'?'c-pet':'c-p'); if(o.kind!=='boom') sfx('hit'); }
  const ab = ENEMIES[e.id].ab||[];
  if (ab.some(a=>a.t==='rage') && e.hp>0){ e.atk *= 1.12; clog(`${e.n} grows angrier! (ATK up)`, 'c-e'); }
  if (e.hp <= 0) killEnemy(e, d, o);
  return d;
}
function killEnemy(e, lastHit, o){
  const c = S.combat; e.dead = true; e.hp = 0; c.killsThisAction = (c.killsThisAction||0)+1;
  const t = ENEMIES[e.id];
  clog(`${e.n} dies.`, 'c-sys');
  S.st.kills++; S.st.floorKills++;
  // xp with level-gap scaling
  const mm = e.minion ? 0.3 : 1;
  let xp = CFG.enemyXP(e.L) * (t.xp||1) * mm; const gap = S.lvl - e.L; if (gap>3) xp *= Math.max(0.25, 1 - (gap-3)*0.18);
  c.rw.xp += xp;
  c.rw.gold += Math.round(CFG.enemyGold(e.L) * (t.gold||1) * rf(0.6,1.4) * mm);
  if (!e.minion){ for (const [id,p] of (t.drops||[])) if (chance(p)) c.rw.items.push(id); if (!t.boss && chance(0.05)) c.rw.items.push(rollItem({maxR:1})); }
  addViews(e.L * 12 * Math.pow(2.6, S.floor-1) * (t.boss?15:1) * (lastHit>=e.maxHp*2?2:1) * mm);
  unlock('first_blood');
  if ((t.tags||[]).includes('goblin')){
    S.st.goblins++; if (S.st.goblins>=10) unlock('goblin_10');
    if (S.eq.weapon==='machete' && (o.kind==='melee')){ S.st.machGob++; if (S.st.machGob>=10 && !S.flags.terror){ S.flags.terror=1; S.eq.weapon='goblin_terror'; unlock('goblin_terror'); toast('SYSTEM', `Your machete glows for a moment. Engraved on the blade: <b>"Goblin Terror of ${esc(S.name)}"</b>. Cool!`, 'loot'); clog(`Your machete glows... "Goblin Terror of ${S.name}" is engraved on it!`, 'c-crit'); } }
  }
  if (o.kind==='melee' && isUnarmed()) unlock('bare_hands');
  if (o.skill==='stomp') unlock('stomp_kill');
  if (lastHit >= e.maxHp*2 || (lastHit>=e.maxHp && e.maxHp>=60 && lastHit>=e.maxHp*1.6)) { if(lastHit>=e.maxHp*2) unlock('overkill'); }
  if (t.human && (e.id==='frank'||e.id==='maggie')) S.flags.pkDead = (S.flags.pkDead||0)+1;
  if (e.id==='bounty_hunter') unlock('bounty');
}

function hitPlayer(e, mult=1, o={}){
  const c = S.combat; if (e.dead) return;
  if (c.pst.trap){ c.pst.trap = 0; const d = Math.round(stat('int')*3 + stat('str')*2); clog(`${e.n} springs your BOOBY TRAP!`, 'c-crit'); sfx('boom'); dmgEnemy(e, d, {kind:'boom', label:'The trap', verb:'blasts'}); return; }
  // pet intercept
  if (S.pet && S.pet.hp>0 && !o.noPet && chance(0.22)){
    const d = Math.max(1, Math.round(e.atk*mult*rf(.8,1.1)*0.8));
    S.pet.hp -= d; clog(`${e.n} hits ${S.pet.name} for ${d}!`, 'c-e');
    if (S.pet.hp<=0){ S.pet.hp=0; clog(`${S.pet.name} is knocked out!`, 'c-e'); }
    return;
  }
  if (!o.unavoidable && Math.random()*100 < dodgeChance(e)){ clog(`You dodge ${e.n}'s attack.`, 'c-dim'); return; }
  let d = e.atk * mult * rf(0.85, 1.15) - defense()*0.6;
  d = Math.max(Math.ceil(e.atk*mult*0.15), Math.round(d));
  if (c.pst.shield>0){ const a=Math.min(c.pst.shield, d); c.pst.shield-=a; d-=a; clog(`Your shield absorbs ${a}.`, 'c-sys'); if(c.pst.shield<=0) delete c.pst.shield; }
  if (d<=0) return;
  S.hp -= d; UIX.hurt = true; sfx('hurt');
  clog(`${e.n} ${o.verb||'hits'} you for ${d}.`, 'c-e');
  for (const a of (ENEMIES[e.id].ab||[])){
    if (a.t==='poison' && chance(a.ch)){ c.pst.poison={t:a.tr, d:a.dmg}; clog('You are poisoned!', 'c-e'); }
    if (a.t==='burn' && chance(a.ch)){ c.pst.burn={t:a.tr, d:a.dmg}; clog('You are on fire!', 'c-e'); }
    if (a.t==='stun' && chance(a.ch)){ c.pst.stun=1; clog('You are stunned!', 'c-e'); }
    if (a.t==='confuse' && chance(a.ch)){ c.pst.confuse=1; clog('Your head swims. You are confused!', 'c-e'); }
    if (a.t==='steal' && chance(a.ch) && S.gold>0){ const g=Math.min(S.gold, rand(4, 6+e.L*3)); S.gold-=g; clog(`${e.n} steals ${g} gold!`, 'c-e'); }
    if (a.t==='drain'){ const h=Math.round(d*a.pct); e.hp=Math.min(e.maxHp, e.hp+h); }
  }
}
function enemyAct(e){
  const c = S.combat; if (e.dead) return;
  if (e.stun>0){ e.stun--; clog(`${e.n} is stunned and does nothing.`, 'c-dim'); return; }
  const ab = ENEMIES[e.id].ab||[];
  if (ab.some(a=>a.t==='enrage') && !e.enraged && e.hp < e.maxHp*0.5){ e.enraged=true; e.atk*=1.35; clog(`${e.n} becomes ENRAGED!`, 'c-crit'); }
  for (const a of ab){
    if (a.t==='summon' && chance(a.ch) && c.en.filter(x=>!x.dead && x.id===a.e).length < a.max && aliveEnemies().length < 6 && (e.summoned||0) < a.max*2){
      const ne = makeEnemy(a.e, Math.max(1, e.L-2)); ne.minion = true; e.summoned = (e.summoned||0)+1; c.en.push(ne);
      clog(e.id==='hoarder' ? `${e.n} retches violently. A ${ne.n} pours out!` : e.id==='clown_car' ? `The door creaks open. Another ${ne.n} climbs out. How many are IN there?` : `${e.n} summons a ${ne.n}!`, 'c-e'); return;
    }
    if (a.t==='heal' && chance(a.ch)){
      const hurt = aliveEnemies().filter(x=>x.hp < x.maxHp*0.7).sort((x,y)=>x.hp/x.maxHp - y.hp/y.maxHp)[0];
      if (hurt){ const h=Math.round(hurt.maxHp*a.pct); hurt.hp=Math.min(hurt.maxHp, hurt.hp+h); clog(`${e.n} heals ${hurt===e?'itself':hurt.n} for ${h}.`, 'c-e'); return; }
    }
    if (a.t==='bomb' && chance(a.ch)){
      clog(`${e.n} lights a stick of dynamite and throws it!`, 'c-e'); sfx('boom');
      hitPlayer(e, a.mult, {unavoidable:true, noPet:true, verb:'blasts'}); return;
    }
  }
  let mult=1, hits=1;
  const multi = ab.find(a=>a.t==='multi'); if (multi){ hits=multi.hits; mult = hits===2?0.62:0.42; }
  const heavy = ab.find(a=>a.t==='heavy'); if (heavy && chance(heavy.ch)){ mult*=heavy.mult; hits=1; clog(`${e.n} winds up a massive blow!`, 'c-e'); }
  for (let h=0; h<hits && S.hp>0 && !e.dead; h++) hitPlayer(e, mult);
}
function enemyPhase(){ for (const e of [...S.combat.en]){ if (S.hp<=0) break; enemyAct(e); } }
function endOfRound(){
  const c = S.combat;
  for (const k of ['poison','burn']){
    const p = c.pst[k]; if (!p) continue;
    S.hp -= p.d; clog(`${k==='poison'?'Poison':'Fire'} deals ${p.d} damage to you.`, 'c-e'); if(--p.t<=0) delete c.pst[k];
  }
  if (S.hp<=0) return;
  if (hasPassive('triage')){ const g=healP(maxHP()*0.04, true); if(g>0) clog(`Triage: +${g} HP.`, 'c-pet'); }
  for (const e of aliveEnemies()){
    for (const k of ['poison','burn']){
      const p = e.st[k]; if(!p) continue;
      e.hp -= p.d; clog(`${e.n} takes ${p.d} ${k} damage.`, 'c-dim'); if(--p.t<=0) delete e.st[k];
      if (e.hp<=0) killEnemy(e, p.d, {kind:'dot'});
    }
    const rg = (ENEMIES[e.id].ab||[]).find(a=>a.t==='regen'); if (rg && !e.dead){ e.hp=Math.min(e.maxHp, e.hp+Math.round(e.maxHp*rg.pct)); }
  }
  for (const k in c.cd){ c.cd[k]--; if (c.cd[k]<=0) delete c.cd[k]; }
  const tgt = c.en[c.target];
  c.en = c.en.filter(x => !(x.dead && x.minion));
  c.target = Math.max(0, c.en.indexOf(tgt));
  c.turn++;
}
function afterPlayerAction(){
  const c = S.combat;
  if (!aliveEnemies().length) return combatWon();
  // pet
  if (S.pet && S.pet.hp>0){
    const t = pick(aliveEnemies());
    dmgEnemy(t, petAtk(), {kind:'pet', label:S.pet.name, verb:pick(['bites','claws','mauls','chomps'])});
    if (S.pet.talks && chance(.12)) clog(`${S.pet.name}: ${pick(PET_QUIPS)}`, 'c-pet');
    if (!aliveEnemies().length) return combatWon();
  }
  enemyPhase();
  if (S.hp<=0) return playerDied();
  endOfRound();
  if (S.hp<=0) return playerDied();
  if (!aliveEnemies().length) return combatWon();
  render();
}
function playerAct(kind, arg){
  const c = S.combat; if (!c || c.over) return;
  UIX.fx = []; UIX.hurt=false; c.killsThisAction = 0; c.menu = null;
  if (c.pst.stun){ delete c.pst.stun; clog('You are stunned and lose your turn!', 'c-e'); return afterPlayerAction(); }
  if (c.pst.confuse && (kind==='attack'||kind==='skill') && chance(.45)){
    delete c.pst.confuse; const d=Math.max(1,Math.round(weaponDmg()*0.5)); S.hp-=d; clog(`You're confused and hit yourself for ${d}! The audience howls.`, 'c-e'); addViews(30*S.floor);
    if (S.hp<=0) return playerDied(); return afterPlayerAction();
  }
  delete c.pst.confuse;
  if (kind==='attack'){
    const e = currentTarget(); if(!e) return;
    dmgEnemy(e, weaponDmg(), {kind:'melee', canMiss:true, canCrit:true});
  } else if (kind==='skill'){
    if (!useSkill(arg)) { render(); return; }
  } else if (kind==='item'){
    const it = ITEMS[arg]; const had = hasItem(arg);
    const r = useItem(arg);
    if (c.over || S.combat!==c) return;                      // escaped (smoke curtain)
    const thrown = had && it && it.fx && (it.fx.aoe || it.fx.single);
    if (r===null && !thrown){ render(); return; }            // nothing happened, no turn spent
    if (r) clog(r, 'c-pet');
  } else if (kind==='crowd'){
    const gain = addViews(S.lvl*40*Math.pow(2.6,S.floor-1) / (1+c.crowd)); c.crowd++;
    clog(pick([`You flex for the cameras. +${fmt(gain)} viewers.`,`You point at the nearest drone and wink. +${fmt(gain)} viewers.`,`You deliver a one-liner. It lands. +${fmt(gain)} viewers.`,`You do a little dance. Somewhere, a billion aliens cheer. +${fmt(gain)} viewers.`]), 'c-sys');
    if (chance(0.18/(c.crowd))){ const id = pick(['potion_heal','snacks','dynamite','potion_mana']); c.rw.items.push(id); clog(`A sponsor loved it! A ${ITEMS[id].n} drops from a tiny parachute.`, 'c-crit'); }
  } else if (kind==='flee'){
    if (c.noFlee) return;
    const avgDex = aliveEnemies().reduce((a,e)=>a+e.dex,0)/Math.max(1,aliveEnemies().length);
    const p = clamp(0.45 + (stat('dex')-avgDex)*0.03, 0.15, 0.9);
    if (chance(p)) return combatFled(false);
    clog('You try to run, but they cut you off!', 'c-e');
  } else if (kind==='lure'){
    c.over = true; c.result='lure'; S.combat=null; S.time -= 3;
    room().done = 1; unlock('exp_denied'); addViews(8000*Math.pow(2.6,S.floor-1));
    giveBox(1,'Adventurer','from an amused sponsor');
    log('You lured the Rage Elemental into the stairwell. It shrieked, flared, and was gone. EXPERIENCE DENIED.', 'l-sys');
    S.args = {lured:true}; go('event', {id:'lured'}); return;
  }
  afterPlayerAction();
}
function useSkill(id){
  const c=S.combat, sk=SKILLS[id]; if(!sk || sk.kind==='passive') return false;
  if ((c.cd[id]||0)>0){ toast('SYSTEM',`${esc(sk.n)} is recharging.`); return false; }
  if (S.mp < (sk.mp||0)){ toast('SYSTEM','Not enough MP.','bad'); return false; }
  S.mp -= sk.mp||0; if (sk.cd) c.cd[id]=sk.cd+1;
  const e = currentTarget(); const L=S.lvl; const I=stat('int');
  switch(id){
    case 'stomp': { const d=(2+stat('str')*2.2)*(1+gearStat('stomp')/100); const done=dmgEnemy(e, d, {kind:'melee', canMiss:true, canCrit:true, skill:'stomp', verb:'stomp on'}); if(done && !e.dead && chance(.25)){ e.stun=1; clog(`${e.n} is stunned!`,'c-sys'); } break; }
    case 'magic_missile': clog('Glowing darts streak from your fingertips!','c-p'); dmgEnemy(e, I*2.4+L, {kind:'spell', canCrit:true}); break;
    case 'heal': { const g=healP(I*4+12); clog(`You heal for ${g}.`,'c-pet'); break; }
    case 'second_wind': { const g=healP(maxHP()*0.25); clog(`Second wind! +${g} HP.`,'c-pet'); break; }
    case 'fear': for (const x of aliveEnemies()){ const p=clamp(0.5+(I-x.L)*0.04 - (x.boss?0.25:0), 0.1, 0.9); if (chance(p)){ x.stun=1; clog(`${x.n} cowers in fear!`,'c-sys'); } else clog(`${x.n} resists.`,'c-dim'); } break;
    case 'shell': { const a=Math.round(I*4+15); c.pst.shield=(c.pst.shield||0)+a; clog(`A shimmering shell surrounds you (${a}).`,'c-sys'); break; }
    case 'fireball': clog('You hurl a roaring fireball!','c-p'); sfx('boom'); for (const x of aliveEnemies()){ dmgEnemy(x, I*2+L, {kind:'spell'}); if(!x.dead) addEnemyStatus(x,'burn',3,Math.round(I*0.6)); } if(c.killsThisAction>=3) unlock('pyro'); break;
    case 'lightning': clog('Lightning arcs from enemy to enemy!','c-p'); for (const x of aliveEnemies()){ dmgEnemy(x, I*2.8+L, {kind:'spell'}); if(!x.dead && chance(.2)){ x.stun=1; } } break;
    case 'booby_trap': c.pst.trap=1; clog('You rig a nasty little surprise in front of you.','c-sys'); break;
    case 'upstage': { for (const x of aliveEnemies()){ const p=clamp(0.35+(stat('cha')+chaBonus()-x.L)*0.04-(x.boss?0.2:0), 0.12, 0.85); if (chance(p)){ x.stun=1; clog(`${x.n} is stunned by your star power!`,'c-sys'); } } const g=addViews(S.lvl*90*Math.pow(2.6,S.floor-1)); clog(`You steal the scene. +${fmt(g)} viewers.`,'c-sys'); break; }
    case 'whirlwind': clog('You spin into a whirlwind of steel!','c-p'); for (const x of aliveEnemies()) dmgEnemy(x, weaponDmg()*0.85, {kind:'melee', canMiss:true, canCrit:true}); break;
    case 'greater_heal': { const g=healP(maxHP()*0.55); delete c.pst.poison; delete c.pst.burn; clog(`Greater Heal! +${g} HP, afflictions cured.`,'c-pet'); break; }
    case 'flurry': for (let k=0;k<3;k++){ const t=currentTarget(); if(!t) break; dmgEnemy(t, unarmedDmg()*0.7, {kind:'melee', canMiss:true, canCrit:true, verb:'pummel'}); } break;
    case 'primal_rage': c.buff.str=(c.buff.str||0)+5; c.buff.dex=(c.buff.dex||0)+3; clog('You ROAR. Something ancient answers. (+5 STR, +3 DEX)','c-crit'); break;
  }
  return true;
}
function combatWon(){
  const c = S.combat; c.over = true; c.result='win';
  const xp = gainXP(c.rw.xp); const gold = addGold(c.rw.gold);
  c.rw.xpGot = xp; c.rw.goldGot = gold;
  for (const id of c.rw.items) addItem(id, 1);
  if (S.hp>0 && S.hp < maxHP()*0.10) unlock('nailbiter');
  if (S.pet && S.pet.hp<=0) S.pet.hp = Math.round(petMaxHP()*0.25);
  if (!['guardian','castle','notut'].includes(c.onWin.t)) S.time -= 1;
  log(`Victory! +${xp} XP, +${gold} gold.`, 'l-good');
  sfx('win'); checkTop10();
  render();
}
function combatFled(smoke){
  const c = S.combat; c.over=true; c.result='fled';
  S.st.flees++; if (S.st.flees>=5) unlock('coward');
  log(smoke?'You vanish in a cloud of smoke.':'You run for your life! '+pick(AI_QUIPS.flee), 'l-sys');
  S.combat = null; S.time -= 1;
  if (S.pet && S.pet.hp<=0) S.pet.hp = Math.round(petMaxHP()*0.25);
  if (S.prev!==S.pos){ S.pos = S.prev; }

}
function playerDied(){
  const c = S.combat; S.hp = 0;
  const killer = aliveEnemies()[0];
  const ending = c ? c.death : 'combat';
  const cause = killer ? `Killed by ${killer.n} (level ${killer.L}).` : 'Killed in combat.';

}
function die(ending, cause){
  S.combat = null; S.dead = {ending, cause}; unlockEnding(ending); sfx('death'); store.del(CFG.saveKey);
  META.runs++; META.best = Math.max(META.best||0, score()); saveMeta();
  go('dead');
}
function finishCombat(){
  const c = S.combat; if(!c || !c.over) return;
  const w = c.onWin; S.combat = null;
  const r = room();
  switch (w.t){
    case 'room': r.done=1; go('explore'); break;
    case 'first': r.done=1; go('explore'); break;
    case 'boss': {
      r.done=1; S.st.bosses++; unlock('neighborhood');
      const id=w.id;
      if (id==='hoarder'){ unlock('hoarder'); S.flags.mapUpgrade=1; revealAll(); toast('MAP UPGRADE', "The Hoarder dropped a neighborhood map. Your map now shows every room on every floor!", 'loot'); }
      giveBox(Math.min(5, Math.floor(S.floor/2)+1), 'Boss', `for killing ${ENEMIES[id].n}`);
      if (id==='brood_chief'){ go('event',{id:'petchamber'}); return; }
      go('explore'); break;
    }
    case 'guardian': {
      r.done=1; S.st.bosses++; S.ff.guardian=1; unlock('guardian'+S.floor);
      giveBox(Math.min(5, S.floor), 'Boss', `for defeating the Floor Guardian`);
      go('explore'); break;
    }
    case 'notut': {
      S.st.bosses++; S.ff.guardian=1; S.flags.tutorial=1; unlock('no_tutorial'); unlock('guardian1');
      const sr = room(S.map.stairs); sr.done=1;
      go('explore'); break;
    }
    case 'castle': {
      r.done=1; S.st.bosses++; S.ff.castles = S.ff.castles||{}; S.ff.castles[w.region]=1;
      giveBox(3,'Boss',`for capturing ${r.nm}`);
      addViews(20000*Math.pow(2.6,S.floor-1));
      if (Object.keys(S.ff.castles).length>=4){ unlock('castles'); addItem('crown4'); toast('SYSTEM','All four castles have fallen. The central bubble trembles... the stairwell is OPEN.','loot'); }
      go('event',{id:'castle_taken', region:w.region}); break;
    }
    case 'event': go('event', Object.assign({}, w.args||{}, {id:w.id, step:w.step})); break;
    case 'none': go('explore'); break;
    default: r.done=1; go('explore');
  }
}

/* ---------------------------- floors & movement ---------------------------- */
function startFloor(f){
  S.floor = f; const F = FLOORS[f];
  S.map = genMap(f); S.pos = S.map.start; S.prev = S.map.start; S.time = F.hours;
  S.floorBuff = {}; S.ff = {}; S.st.floorKills = 0; S.st.floorViews0 = S.views;
  reveal(S.pos); if (S.flags.mapUpgrade) revealAll();
  document.documentElement.style.setProperty('--floor-accent', F.accent);
  log(`— Entered ${F.name} —`, 'l-sys');
  // bounty hunters on floor 4 if famous
  if (f===4 && myRank()<=10){ let n=0; for (const r of S.map.rooms){ if (r.type==='monster' && r.dist>2 && n<3 && chance(.4)){ r.bounty=1; n++; } } }
}
function canMove(d){ return S.map && nbr(S.pos,d) >= 0; }
function move(d){
  if (S.scene!=='explore') return;
  const n = nbr(S.pos, d); if (n<0) return;
  const F = FLOORS[S.floor];
  S.prev = S.pos; S.pos = n; S.st.steps++;
  S.time -= F.move;
  const regen = CFG.regenPerMove + gearStat('regen')/100 + (S.race==='primal'?0.03:0);
  healP(maxHP()*regen, true); S.mp = Math.min(maxMP(), S.mp + Math.max(1, Math.round(maxMP()*0.03)));
  if (S.pet && S.pet.hp>0) S.pet.hp = Math.min(petMaxHP(), S.pet.hp + Math.round(petMaxHP()*0.05));
  reveal(n); sfx('step');
  if (timeCheck()) return;
  enterRoom();
}
function timeCheck(){
  const t = S.time;
  for (const th of [24,12,3]){ if (t<=th && !S.ff['warn'+th]){ S.ff['warn'+th]=1; toast('SYSTEM', `Attention crawlers: this floor collapses in <b>${th} hours</b>. Find a stairwell. Or don't! It's your funeral. Literally.`, 'bad'); } }
  if (t<=0){ die('collapse', `The floor collapsed around you. You were ${S.map.rooms[S.pos].type==='stairs'?'standing right next to the stairs, which is somehow worse':'nowhere near the stairs'}.`); return true; }
  const day = Math.floor((FLOORS[S.floor].hours - t) / 24);
  if (day > (S.ff.day||0) && t > 24){ S.ff.day = day; toast('SYSTEM ANNOUNCEMENT', pick(DAILY_AI)()); }
  return false;
}
function crawlersLeft(){ const f = Math.max(1,S.floor) - 1 + floorProgress(); return Math.round(9.1e6 * Math.pow(0.42, f) / 1000) * 1000; }
const DAILY_AI = [
  () => `Good morning, crawlers! Another day down. Crawlers remaining: <b>${crawlersLeft().toLocaleString()}</b>. That number only goes one direction!`,
  () => `Reminder: loot boxes only open in safe rooms. Crawlers who die holding unopened boxes are, frankly, hilarious.`,
  () => `Today's most popular crawler is <b>${esc(leaderboard()[0].n)}</b>. Today's least popular crawler is somebody else. Could be you!`,
  () => `Fun fact: the stairwell is somewhere on this floor. That's the fact. That's all you get.`,
  () => `The sponsors are getting restless. Do something interesting. Preferably something on fire.`,
  () => `Time remaining on this floor: <b>${fmtTime(S.time)}</b>. Do the math. We did. It's grim.`,
  () => `A friendly reminder that the System is not responsible for injuries, deaths, or emotional damage sustained while crawling.`,
];
function spawnFor(r){
  const F = FLOORS[S.floor];
  if (S.floor===5){ const reg = r.region || pick(['land','sea','air','sub']); return buildGroup(wpick(F.regionSpawns[reg]).map(x=>x.slice()), 0); }
  const early = F.early && r.dist<=3;
  return buildGroup(wpick(early?F.early:F.spawns), 0);
}
function enterRoom(){
  const r = room();
  if (r.done){
    if (['monster','elite','empty','event'].includes(r.type) && !r.wander && chance(CFG.wanderChance)){
      r.wander = 1; return startCombat(spawnFor(r), {intro:'Something wandered in while you were away!', onWin:{t:'room'}});
    }
    return go('explore');
  }
  switch (r.type){
    case 'monster': {
      if (r.first) return go('event',{id:'first_goblins'});
      if (r.bounty) return startCombat(['bounty_hunter'], {intro:'A crawler steps out of the shadows, checks a glowing bounty notice, and grins. "Nothing personal."'});
      return go('event',{id:'monster'});
    }
    case 'elite': return go('event',{id:'monster', elite:1});
    case 'event': return go('event',{id:r.ev});
    case 'boss': return r.passed ? go('explore') : go('event',{id:'boss'});
    case 'stairs': return go('explore');
    case 'safe': r.done=0; return go('safe');
    case 'guild': return go(S.floor===1 && !S.flags.tutorial ? 'event' : 'guild', S.floor===1 && !S.flags.tutorial ? {id:'tutorial_door'} : {});
    case 'thrax': return go('event',{id:'thrax'});
    case 'rage': return r.passed ? go('explore') : go('event',{id:'rage'});
    case 'platform': return go('event',{id:'platform'});
    case 'castle': return go('event',{id:'castle'});
    default: r.done=1; return go('explore');
  }
}

/* ---------------------------- saving ---------------------------- */
function save(){ if (!S || S.dead || S.won) return; store.set(CFG.saveKey, S); }
function checkpoint(){ if (!S || S.dead) return; store.set(CFG.ckptKey, S); }
function loadGame(key=CFG.saveKey){
  const s = store.get(key); if (!s) return false;
  S = s; S.dead = null;
  if (S.combat && S.combat.over && S.combat.result!=='win') { S.combat = null; if (S.scene==='combat') S.scene='explore'; }
  if (S.combat) UID = Math.max(UID, ...S.combat.en.map(e=>e.uid||0)) + 1;
  if (S.floor) document.documentElement.style.setProperty('--floor-accent', FLOORS[S.floor].accent);
  render(); return true;
}

const SCENES = {};
function go(id, args){
  if (!S) return;
  S.scene = id; S.args = args || {};
  const sc = SCENES[id];
  if (sc && sc.enter) sc.enter(S.args);
  if (S.scene !== id) return;          // enter() redirected
  save(); render();
}
const P = (...xs) => xs.map(x=>`<p>${x}</p>`).join('');
const SYS = t => `<div class="sys">${t}</div>`;
const C = (label, act, o={}) => Object.assign({label, act}, o);
function done(){ room().done = 1; go('explore'); }
function back(){ S.pos = S.prev; go('explore'); }
function cont(label='Continue'){ return C(label, done, {cls:'primary'}); }
function fp(){ return floorPrice(); }

const EV_ICON = {treasure:'💰', trap:'⚠️', npc_agatha:'🛒', npc_injured:'🩸', npc_royal:'🐈', npc_meadowlark:'👵', npc_frankmaggie:'🔥', maestro:'📺', vending:'🥤', sponsor:'🪂', shrine:'⛲', sideshow:'🎪', vine_victim:'🌿', lostfound:'🧳'};
function mapIcon(r, i){
  if (!r.seen) return '';
  if (i===S.pos) return S.cls ? CLASSES[S.cls].i : '🧍';
  const known = r.vis || S.flags.mapUpgrade;
  switch (r.type){
    case 'start': return '🔰';
    case 'stairs': return (S.floor===5 && Object.keys(S.ff.castles||{}).length<4) ? '🔒' : '⬇️';
    case 'safe': return '🛋️';
    case 'guild': return '📚';
    case 'castle': return r.done ? '🚩' : '🏰';
    case 'platform': return '🚉';
    case 'boss': return r.done ? '✖️' : '💀';
    case 'rage': return r.done ? '' : '🔥';
  }
  if (!known || r.done) return '';
  if (r.type==='monster') return r.bounty ? '🎯' : '⚔️';
  if (r.type==='elite') return '☠️';
  if (r.type==='thrax') return '🦗';
  if (r.type==='event') return EV_ICON[r.ev] || '❔';
  return '';
}

function searchRoom(){
  const r = room(); r.srch = 1; S.time -= 1;
  if (timeCheck()) return;
  if (chance(0.10)) return startCombat(spawnFor(r), {intro:'You disturbed something while searching!', onWin:{t:'none'}});
  const roll = Math.random();
  if (roll < 0.45){ const id = pick(['rag','gunpowder','herb','nails','jug','herb','rag','water','snacks','candy','booze']); addItem(id); toast('SEARCH', `You found ${ITEMS[id].i} <b>${esc(ITEMS[id].n)}</b>.`, 'loot'); }
  else if (roll < 0.62){ const g = addGold(rand(3,10)*S.floor); log(`Found ${g} gold.`, 'l-loot'); toast('SEARCH', `You found 🪙 <b>${g} gold</b>.`, 'loot'); }
  else if (roll < 0.68){ const id = rollItem({maxR:2}); addItem(id); toast('SEARCH', `Hidden under the debris: ${ITEMS[id].i} <b>${esc(ITEMS[id].n)}</b>!`, 'loot'); }
  else { toast('SEARCH', 'Nothing but dust and an old goblin toenail.'); }
  render();
}
function camp(){
  S.time -= 6; if (timeCheck()) return;
  if (chance(0.3)){ return startCombat(spawnFor(room()), {intro:'You wake up to something chewing on your boot. AMBUSH!', ambush:true, onWin:{t:'none'}}); }
  healP(maxHP()*0.5, true); S.mp = Math.min(maxMP(), S.mp + Math.round(maxMP()*0.5)); if (S.pet) S.pet.hp = petMaxHP();
  log('You camp for six hours. Nothing eats you.', 'l-good'); toast('CAMP','You rest for 6 hours. Nothing eats you. This time.');
  render();
}

function itemCard(id, opts={}){
  const it = ITEMS[id]; if(!it) return '';
  const q = opts.qty ? ` <span class="qty">×${opts.qty}</span>` : '';
  const stats = it.s ? Object.entries(it.s).map(([k,v])=>statLabel(k,v)).join(' · ') : '';
  return `<div class="item rar-${it.r}"><div class="ii">${it.i}</div><div style="flex:1;min-width:0"><div class="in">${esc(it.n)}${q}</div>
    <div class="id">${RARITY_NAME[it.r]} ${it.t==='weapon'&&it.unarmed?'fist weapon':it.t}${it.cursed?' · <span style="color:var(--red)">cursed</span>':''}</div>
    ${stats?`<div class="id" style="color:var(--text)">${stats}</div>`:''}<div class="id">${esc(it.d)}</div>${opts.btns?`<div class="ib">${opts.btns}</div>`:''}</div></div>`;
}
function statLabel(k,v){
  const names = {dmg:'DMG',def:'DEF',str:'STR',con:'CON',dex:'DEX',int:'INT',cha:'CHA',crit:'Crit %',mp:'MP',hp:'HP',regen:'Regen %',views:'Viewers %',goldPct:'Gold %',boom:'Explosives %',stomp:'Stomp %'};
  return `${v>0&&k!=='dmg'&&k!=='def'?'+':''}${v} ${names[k]||k}`;
}
function bar(cls, cur, max, label){
  const p = max>0 ? clamp(cur/max*100,0,100) : 0;
  return `<div class="bar ${cls}"><div class="fill" style="width:${p}%"></div><div class="lbl"><span>${label}</span><span>${Math.max(0,Math.round(cur))} / ${Math.round(max)}</span></div></div>`;
}

function render(){
  document.body.classList.toggle('dead', !!(S && S.scene==='dead'));
  document.body.classList.toggle('won', !!(S && S.scene==='ending'));
  if (!S){ renderTitle(); renderTop(); return; }
  const story = !S.floor;
  document.body.classList.toggle('story', story);
  renderTop();
  if (!story){ renderChar(); renderMap(); renderLog(); }
  renderScene();
  if (UIX.modal) renderModal();
  save();
}
function renderTop(){
  $('#tb-name').textContent = S && S.name ? S.name.toUpperCase() : '???';
  if (!S || !S.floor) return;
  const F = FLOORS[S.floor];
  $('#tb-floor').textContent = `Floor ${S.floor} · ${F.name}`;
  const t = $('#tb-timer'); t.textContent = `⏳ ${fmtTime(S.time)}`; t.classList.toggle('warn', S.time<=24 && S.time>6); t.classList.toggle('crit', S.time<=6);
  $('#tb-views').textContent = `${fmt(S.views)} viewers`;
  $('#tb-gold').textContent = `🪙 ${S.gold}`;
  const pts = $('#tb-pts'); pts.classList.toggle('hidden', !S.pts); pts.textContent = S.pts;
  const bx = $('#tb-boxes'); bx.classList.toggle('hidden', !S.boxes.length); bx.textContent = S.boxes.length;
}
function renderChar(){
  const av = S.cls ? CLASSES[S.cls].i : S.race ? RACES[S.race].i : '🧍';
  const sub = S.race ? `${RACES[S.race].n}${S.cls?' '+CLASSES[S.cls].n:''}` : 'Unclassed crawler';
  const st = STATS.map(k=>{ const v=stat(k); const up=v>S.base[k]; return `<div class="stat" title="${STAT_NAME[k]}: ${STAT_DESC[k]}"><div class="k">${k.toUpperCase()}</div><div class="v ${up?'up':''}">${v}</div></div>`; }).join('');
  const eq = SLOTS.map(sl=>{ const id=S.eq[sl]; return id ? `<span title="${esc(SLOT_NAME[sl])}: ${esc(ITEMS[id].n)}">${ITEMS[id].i}</span>` : `<span class="empty" title="${SLOT_NAME[sl]}: empty">·</span>`; }).join('');
  const pet = S.pet ? `<div style="margin-top:10px"><div class="kv"><span>${PETS[S.pet.kind].i} ${esc(S.pet.name)}</span><b>Lv ${petLevel()}</b></div>${bar('pet', S.pet.hp, petMaxHP(), S.pet.hp>0?'Pet HP':'Knocked out')}</div>` : '';
  const c = S.combat;
  const statuses = c && !c.over ? Object.entries(c.pst).map(([k,v])=>`<span class="st">${({poison:'☠️ Poisoned',burn:'🔥 Burning',stun:'💫 Stunned',confuse:'🌀 Confused',shield:`🛡️ Shield ${v}`,trap:'🪤 Trap set'})[k]||k}</span>`).join('') : '';
  $('#charpanel').innerHTML = `
    <div class="who"><div class="avatar">${av}</div><div><div class="nm">${esc(S.name)}</div><div class="sub">Level ${S.lvl} · ${esc(sub)}</div></div></div>
    ${bar('hp', S.hp, maxHP(), 'HP')}${bar('mp', S.mp, maxMP(), 'MP')}${bar('xp', S.xp, CFG.xpNext(S.lvl), 'XP')}
    ${statuses?`<div class="statuses">${statuses}</div>`:''}
    <div class="stats">${st}</div>
    <div style="margin-top:10px">
      <div class="kv"><span>Attack</span><b>~${Math.round(weaponDmg())}${isUnarmed()?' (fists)':''}</b></div>
      <div class="kv"><span>Defense</span><b>${defense()}</b></div>
      <div class="kv"><span>Crit chance</span><b>${Math.round(critChance())}%</b></div>
      <div class="kv"><span>Rank</span><b>#${myRank()}</b></div>
    </div>
    <div class="equip-mini">${eq}</div>
    ${pet}
    ${S.pts?`<div class="pts-alert" data-open="char">★ ${S.pts} stat point${S.pts>1?'s':''} to spend</div>`:''}`;
}
function renderMap(){
  if (!S.map) return;
  const m = S.map; const el = $('#map');
  el.style.gridTemplateColumns = `repeat(${m.w}, auto)`;
  let h = '';
  m.rooms.forEach((r,i)=>{
    const cls = ['cell'];
    if (!r.seen) cls.push('unk'); else cls.push(r.vis?'vis':'seen');
    if (i===S.pos) cls.push('here');
    if (r.seen){ if(!r.d[0]) cls.push('wn'); if(!r.d[1]) cls.push('we'); if(!r.d[2]) cls.push('ws'); if(!r.d[3]) cls.push('ww'); }
    const adj = [0,1,2,3].find(d=>nbr(S.pos,d)===i);
    h += `<div class="${cls.join(' ')}" ${adj!==undefined && S.scene==='explore'?`data-move="${adj}" style="cursor:pointer"`:''} title="${r.seen?esc(r.nm):''}"><span class="ic">${mapIcon(r,i)}</span></div>`;
  });
  el.innerHTML = h;
  $('#map-floorname').textContent = `· ${FLOORS[S.floor].name}`;
  $('#map-legend').innerHTML = `<span>🔰 start</span><span>⬇️ stairs</span><span>🛋️ safe</span><span>📚 guild</span><span>💀 boss</span>${S.floor===4?'<span>🚉 train</span>':''}${S.floor===5?'<span>🏰 castle</span>':''}`;
}
function renderLog(){
  $('#log').innerHTML = S.log.slice(-60).reverse().map(l=>`<div class="${l.c}">${esc(l.t)}</div>`).join('');
}
function choicesHTML(list){
  UIX.choices = list;
  return `<div class="choices">${list.map((c,i)=>`<button class="choice ${c.cls||''}" data-ch="${i}" ${c.disabled||!c.act?'disabled':''}><span class="key">${i<9?i+1:''}</span><span class="ct">${esc(c.label)}${c.sub?`<span class="cs">${esc(c.sub)}</span>`:''}</span></button>`).join('')}</div>`;
}
function renderScene(){
  const sc = SCENES[S.scene];
  const v = sc && sc.view ? sc.view(S.args) : {title:'...', html:'', choices:[]};
  if (v.custom==='combat') return renderCombat();
  const head = `<div class="scene-head"><div class="scene-art">${v.art||'❔'}</div><div><div class="scene-kicker">${esc(v.kicker||'')}</div><h2 class="scene-title">${esc(v.title||'')}</h2></div></div>`;
  let body = `<div class="scene-text">${v.html||''}</div>`;
  let ctrl;
  if (v.dpad){
    const btn = (d) => `<button data-dir="${d}" ${canMove(d)?'':'disabled'} title="${DIRS[d][2]}">${DIRS[d][3]}</button>`;
    ctrl = `<div class="explore-row">${choicesHTML(v.choices||[])}<div class="dpad"><span></span>${btn(0)}<span></span>${btn(3)}<div class="c">${fmtTime(S.time)}</div>${btn(1)}<span></span>${btn(2)}<span></span></div></div>`;
  } else ctrl = choicesHTML(v.choices||[]);
  $('#scene').innerHTML = (S.floor ? mstat() : '') + head + body + ctrl;
  const inp = $('#name-in') || $('#pet-in'); if (inp) setTimeout(()=>inp.focus(), 30);
}
function renderCombat(){
  const c = S.combat; if (!c){ S.scene='explore'; return renderScene(); }
  const tgt = currentTarget();
  const cards = c.en.map((e,i)=>`<div class="enemy ${e.boss?'boss':''} ${e.dead?'dead':''} ${e===tgt&&!c.over?'target':''} ${UIX.fx.includes(e.uid)?'hit':''}" data-tgt="${i}" title="${esc(ENEMIES[e.id].d)}">
      ${e===tgt&&!c.over?'<span class="tgt">🎯</span>':''}<div class="ei">${e.i}</div><div class="en">${esc(e.n)}</div><div class="el">Lv ${e.L}${e.stun?' · 💫':''}${e.st.burn?' · 🔥':''}${e.st.poison?' · ☠️':''}${e.enraged?' · 😡':''}</div>
      ${bar('hp', e.hp, e.maxHp, '')}</div>`).join('');
  UIX.fx = [];
  const logH = c.log.slice(-14).map(l=>`<div class="${l.c}">${esc(l.t)}</div>`).join('');
  let ch = [];
  if (c.over){
    const rw = c.rw;
    const items = rw.items.length ? `<div class="items" style="margin-top:8px">${rw.items.map(id=>itemCard(id)).join('')}</div>` : '';
    $('#scene').innerHTML = `<div class="scene-head"><div class="scene-art">🏆</div><div><div class="scene-kicker">Combat · Turn ${c.turn}</div><h2 class="scene-title">Victory!</h2></div></div>
      <div class="enemies">${cards}</div>
      <div class="scene-text">${P(`<span class="good">+${rw.xpGot} XP</span> · <span class="say">+${rw.goldGot} gold</span>${rw.items.length?' · loot:':''}`)}${items}</div>` + choicesHTML([C('Continue', finishCombat, {cls:'primary'})]);
    return;
  }
  if (c.pst.stun){ ch = [C('You are stunned! (lose this turn)', ()=>playerAct('wait'), {cls:'danger'})]; }
  else if (c.menu==='skills'){
    const sk = S.skills.filter(id=>SKILLS[id].kind!=='passive');
    ch = sk.map(id=>{ const s=SKILLS[id]; const cd=c.cd[id]||0; return C(`${s.i} ${s.n}${s.mp?` (${s.mp} MP)`:''}${cd?` — ${cd} turn${cd>1?'s':''}`:''}`, ()=>playerAct('skill', id), {disabled: cd>0 || S.mp<(s.mp||0), sub:s.d}); });
    ch.push(C('← Back', ()=>{ c.menu=null; render(); }));
  } else if (c.menu==='items'){
    const its = Object.keys(S.inv).filter(id=>ITEMS[id].c);
    ch = its.map(id=>C(`${ITEMS[id].i} ${ITEMS[id].n} ×${S.inv[id]}`, ()=>playerAct('item', id), {sub:ITEMS[id].d, disabled: ITEMS[id].fx.escape && c.noFlee}));
    if (!its.length) ch.push(C('Your bag has nothing useful for a fight.', null, {disabled:true}));
    ch.push(C('← Back', ()=>{ c.menu=null; render(); }));
  } else {
    const avgDex = aliveEnemies().reduce((a,e)=>a+e.dex,0)/Math.max(1,aliveEnemies().length);
    const fleeP = clamp(0.45 + (stat('dex')-avgDex)*0.03, 0.15, 0.9);
    ch = [
      C(`${isUnarmed()?'👊 Punch':'⚔️ Attack'} ${tgt?tgt.n:''}`, ()=>playerAct('attack'), {cls:'primary', sub:`~${Math.round(weaponDmg())} dmg · ${tgt?Math.round(hitChance(tgt)):0}% to hit · ${Math.round(critChance())}% crit`}),
      C('✨ Skills ▸', ()=>{ c.menu='skills'; render(); }, {sub: S.skills.filter(id=>SKILLS[id].kind!=='passive').map(id=>SKILLS[id].n).join(', ')}),
      C('🎒 Items ▸', ()=>{ c.menu='items'; render(); }, {sub:`${Object.keys(S.inv).filter(id=>ITEMS[id].c).length} usable item types`}),
      C('📸 Play to the crowd', ()=>playerAct('crowd'), {sub:'Lose your turn, gain viewers. Sponsors might send something.'}),
    ];
    if (c.lure && stairsKnown()) ch.push(C('🪜 Lure it toward the stairwell', ()=>playerAct('lure'), {cls:'special', sub:'Experience Denied, but you survive. 3 hours.'}));
    ch.push(C(c.noFlee ? '🚫 No escape from this fight' : '🏃 Run for your life', ()=>playerAct('flee'), {disabled:c.noFlee, sub: c.noFlee?'':`${Math.round(fleeP*100)}% chance`}));
  }
  const petLine = S.pet ? `<div class="pet-line">${PETS[S.pet.kind].i} <b>${esc(S.pet.name)}</b> ${S.pet.hp>0?`fights at your side (${S.pet.hp}/${petMaxHP()} HP)`:'is knocked out'}</div>` : '';
  $('#scene').innerHTML = mstat() + `<div class="scene-head"><div class="scene-art">⚔️</div><div><div class="scene-kicker">Combat · Turn ${c.turn}</div><h2 class="scene-title">${c.en.some(e=>e.boss)?'Boss Battle!':'Fight!'}</h2></div></div>
    <div class="enemies">${cards}</div>${petLine}
    <div class="clog" id="clog">${logH}</div>` + choicesHTML(ch);
  const cl = $('#clog'); if (cl) cl.scrollTop = cl.scrollHeight;
  if (UIX.hurt){ $('#scene').classList.remove('flash-red'); void $('#scene').offsetWidth; $('#scene').classList.add('flash-red'); UIX.hurt=false; }
}
function mstat(){ return `<div class="mstat">${bar('hp', S.hp, maxHP(), 'HP')}${bar('mp', S.mp, maxMP(), 'MP')}</div>`; }
function renderTitle(){
  document.body.classList.add('story');
  const saved = store.get(CFG.saveKey);
  const got = Object.keys(META.endings).length, tot = Object.keys(ENDINGS).length;
  const list = [C('New Crawl', ()=>newGame(), {cls:'primary', sub:'Enter the dungeon. Try not to die. (You will probably die.)'})];
  if (saved && !saved.dead) list.unshift(C(`Continue: ${saved.name||'Crawler'} — Floor ${saved.floor||0}, Level ${saved.lvl}`, ()=>{ loadGame(); }, {cls:'special'}));
  list.push(C('How to play', ()=>openModal('help')));
  list.push(C(`Endings found: ${got}/${tot}`, ()=>openModal('endings')));
  $('#scene').innerHTML = `<div class="title-hero"><div class="big">🕳️</div><h1>DUNGEON CRAWLER</h1><div class="tag">Enhanced Edition · A fan-made tribute</div></div>
    <div class="scene-text" style="text-align:center;margin-top:10px">${P('The world ended at 2:23 in the morning. You were out for a walk. Now there is a dungeon, eighteen floors deep, and a galaxy of aliens watching to see how you die.','<span class="muted">Five floors. Loot boxes. Bosses. Bad decisions. Billions of viewers.</span>')}</div>
    ${choicesHTML(list)}
    <div class="fine">Inspired by Matt Dinniman's <i>Dungeon Crawler Carl</i>. Unofficial, non-commercial fan project. Expanded from an original Twine story.</div>`;
}

function inSafeZone(){ return S && ['safe','guild'].includes(S.scene); }
function renderModal(){
